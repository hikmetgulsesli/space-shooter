<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Main Menu Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#00d4ff",
          "background-light": "#f5f8f8",
          "background-dark": "#1a1a1a",
          "panel-bg": "#232323",
          "border-color": "#333333"
        },
        fontFamily: {
          "display": ["Space Grotesk"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
      },
    },
  }
</script>
<style>
  .grid-bg {
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .neon-glow {
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
  }
  .btn-industrial {
    position: relative;
    border: 2px solid theme('colors.border-color');
    background: theme('colors.panel-bg');
    transition: all 0.3s ease;
  }
  .btn-industrial::before {
    content: '';
    position: absolute;
    top: -4px; right: -4px; bottom: -4px; left: -4px;
    border: 1px solid theme('colors.primary');
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .btn-industrial:hover {
    border-color: theme('colors.primary');
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.2) inset;
  }
  .btn-industrial:hover::before {
    opacity: 0.5;
  }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen relative overflow-hidden">
<div class="absolute inset-0 grid-bg pointer-events-none"></div>
<div class="absolute top-1/4 left-1/4 w-32 h-32 border border-primary/20 rotate-45 pointer-events-none rounded"></div>
<div class="absolute bottom-1/3 right-1/4 w-48 h-48 border border-primary/10 rounded-full pointer-events-none"></div>
<div class="relative z-10 flex flex-col min-h-screen p-8">
<header class="flex justify-center items-center py-12">
<h1 class="text-6xl md:text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 neon-glow tracking-widest text-center">
        ASTRO BLASTER
      </h1>
</header>
<main class="flex-1 flex justify-center items-center">
<button class="btn-industrial px-12 py-6 text-2xl font-bold text-primary tracking-widest uppercase rounded">
        START MISSION
      </button>
</main>
<footer class="flex justify-between items-end mt-auto pointer-events-none">
<button class="pointer-events-auto p-4 border border-border-color bg-panel-bg hover:border-primary hover:text-primary transition-colors rounded group flex items-center justify-center">
<span class="material-symbols-outlined text-3xl group-hover:drop-shadow-[0_0_8px_rgba(0,212,255,0.8)] transition-all">settings</span>
</button>
<div class="flex flex-col gap-2 items-center pointer-events-auto">
<div class="h-2 w-32 bg-border-color rounded overflow-hidden">
<div class="h-full w-2/3 bg-primary"></div>
</div>
<p class="text-xs text-slate-400 uppercase tracking-widest">System Ready</p>
</div>
<button class="pointer-events-auto p-4 border border-border-color bg-panel-bg hover:border-primary hover:text-primary transition-colors rounded group flex items-center justify-center">
<span class="material-symbols-outlined text-3xl group-hover:drop-shadow-[0_0_8px_rgba(0,212,255,0.8)] transition-all">volume_up</span>
</button>
</footer>
</div>
</body></html>
