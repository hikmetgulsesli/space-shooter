<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Main Menu</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00d4ff",
              "background-light": "#f5f8f8",
              "background-dark": "#0f2023",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .grid-bg {
            background-image: 
                linear-gradient(to right, rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.6), 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .box-glow {
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.1) inset;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display antialiased overflow-hidden selection:bg-primary selection:text-background-dark">
<div class="relative min-h-screen w-full flex flex-col items-center justify-center grid-bg">
<!-- Floating particles effect simulated with absolute divs -->
<div class="absolute inset-0 overflow-hidden pointer-events-none opacity-50">
<div class="absolute top-[20%] left-[15%] w-1 h-1 bg-primary rounded-full shadow-[0_0_8px_#00d4ff]"></div>
<div class="absolute top-[60%] left-[80%] w-1.5 h-1.5 bg-primary rounded-full shadow-[0_0_10px_#00d4ff] opacity-70"></div>
<div class="absolute top-[80%] left-[25%] w-0.5 h-0.5 bg-primary rounded-full shadow-[0_0_5px_#00d4ff]"></div>
<div class="absolute top-[30%] left-[70%] w-1 h-1 bg-primary rounded-full shadow-[0_0_8px_#00d4ff] opacity-40"></div>
</div>
<!-- Industrial UI Frame -->
<div class="absolute inset-4 border border-primary/20 pointer-events-none z-0">
<!-- Corner Accents -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary/50"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary/50"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary/50"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary/50"></div>
<!-- Top indicator -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-background-dark px-4 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary/40 animate-pulse"></span>
<span class="text-[10px] font-mono tracking-widest text-primary/40">SYS_ONLINE</span>
</div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center w-full max-w-2xl px-6 py-12">
<!-- Header / Title -->
<div class="mb-16 text-center relative">
<!-- Decorative scanline behind title -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-px bg-gradient-to-r from-transparent via-primary/30 to-transparent -z-10"></div>
<h1 class="text-6xl md:text-8xl font-bold tracking-[0.05em] text-white text-glow">
                    ASTRO<br/>BLASTER
                </h1>
<p class="mt-4 text-sm font-mono text-primary/70 tracking-[0.3em] uppercase">Tactical Space Combat Simulator</p>
</div>
<!-- Menu Buttons -->
<nav class="flex flex-col gap-4 w-full max-w-xs relative">
<!-- Vertical connecting line -->
<div class="absolute left-[-20px] top-4 bottom-4 w-px bg-primary/20"></div>
<button class="group relative w-full flex items-center justify-between px-6 py-4 border border-primary/30 bg-background-dark/80 hover:bg-primary transition-all duration-300 box-glow overflow-hidden cursor-pointer">
<!-- Terminal accent line -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary/50 group-hover:bg-background-dark transition-colors"></div>
<span class="font-mono text-lg font-bold tracking-widest text-primary group-hover:text-background-dark transition-colors z-10">&gt; START GAME</span>
<span class="material-symbols-outlined text-primary group-hover:text-background-dark transition-colors z-10 text-xl">play_arrow</span>
</button>
<button class="group relative w-full flex items-center justify-between px-6 py-4 border border-primary/30 bg-background-dark/80 hover:bg-primary transition-all duration-300 box-glow overflow-hidden cursor-pointer">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary/50 group-hover:bg-background-dark transition-colors"></div>
<span class="font-mono text-lg font-bold tracking-widest text-primary group-hover:text-background-dark transition-colors z-10">&gt; HIGH SCORES</span>
<span class="material-symbols-outlined text-primary group-hover:text-background-dark transition-colors z-10 text-xl">leaderboard</span>
</button>
<button class="group relative w-full flex items-center justify-between px-6 py-4 border border-primary/30 bg-background-dark/80 hover:bg-primary transition-all duration-300 box-glow overflow-hidden cursor-pointer">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary/50 group-hover:bg-background-dark transition-colors"></div>
<span class="font-mono text-lg font-bold tracking-widest text-primary group-hover:text-background-dark transition-colors z-10">&gt; SETTINGS</span>
<span class="material-symbols-outlined text-primary group-hover:text-background-dark transition-colors z-10 text-xl">settings</span>
</button>
</nav>
</div>
<!-- Footer / Version -->
<div class="absolute bottom-8 right-8 flex items-center gap-2 text-primary/50 font-mono text-xs z-20">
<span class="material-symbols-outlined text-[14px]">terminal</span>
<span>v1.0.4-BETA</span>
</div>
<!-- Bottom left system info -->
<div class="absolute bottom-8 left-8 flex flex-col gap-1 text-primary/30 font-mono text-[10px] z-20 hidden md:flex">
<span>RAM: 4096MB ALLOCATED</span>
<span>GPU: NEURAL ENGINE ACTIVE</span>
<span>NET: CONNECTED [SECURE]</span>
</div>
</div>
</body></html>
