<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Asteroid Defender Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00d4ff",
                        "accent": "#f59e0b",
                        "background-light": "#0d1117",
                        "background-dark": "#0d1117",
                        "surface-dark": "#161b22",
                        "surface-border": "#30363d",
                        "text-muted": "#8b949e",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "mono": ["Fira Code", "monospace"],
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "9999px"},
                    backgroundImage: {
                        'grid-pattern': 'linear-gradient(to right, #30363d 1px, transparent 1px), linear-gradient(to bottom, #30363d 1px, transparent 1px)',
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3)',
                        'accent-glow': '0 0 8px rgba(245, 158, 11, 0.6)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #0d1117;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 60%),
                linear-gradient(to right, rgba(48, 54, 61, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(48, 54, 61, 0.2) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
    </style>
</head>
<body class="font-display text-slate-100 min-h-screen overflow-hidden antialiased selection:bg-primary selection:text-background-dark">
<div class="relative flex h-screen w-full flex-col group/design-root overflow-hidden">
<!-- Top Nav / Header -->
<header class="flex items-center justify-between border-b border-surface-border bg-surface-dark/80 backdrop-blur-sm px-6 py-4 z-10">
<div class="flex items-center gap-3 text-primary">
<span class="material-symbols-outlined text-2xl">rocket_launch</span>
<h2 class="text-primary text-xl font-bold tracking-widest uppercase shadow-neon" style="text-shadow: 0 0 10px rgba(0,212,255,0.5);">ASTEROID DEFENDER</h2>
</div>
<div class="flex items-center gap-6">
<div class="font-mono text-xs text-text-muted flex items-center gap-2 border border-surface-border px-3 py-1 bg-background-dark/50">
<span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_rgba(34,197,94,0.8)]"></span>
                SYS: ONLINE
            </div>
<div class="flex gap-3">
<button aria-label="Settings" class="flex items-center justify-center rounded border border-surface-border h-9 w-9 bg-surface-dark text-text-muted hover:text-primary hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">
<span class="material-symbols-outlined text-sm">settings</span>
</button>
<button aria-label="Messages" class="flex items-center justify-center rounded border border-surface-border h-9 w-9 bg-surface-dark text-text-muted hover:text-primary hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">
<span class="material-symbols-outlined text-sm">chat</span>
</button>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center relative z-10 p-6">
<!-- Corner Decorative Elements -->
<div class="absolute top-8 left-8 border-t-2 border-l-2 border-primary/40 w-16 h-16 opacity-50"></div>
<div class="absolute top-8 right-8 border-t-2 border-r-2 border-primary/40 w-16 h-16 opacity-50"></div>
<div class="absolute bottom-8 left-8 border-b-2 border-l-2 border-primary/40 w-16 h-16 opacity-50"></div>
<div class="absolute bottom-8 right-8 border-b-2 border-r-2 border-primary/40 w-16 h-16 opacity-50"></div>
<div class="flex flex-col items-center w-full max-w-2xl">
<!-- Title Section -->
<div class="text-center mb-16 relative">
<h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-primary tracking-tighter shadow-neon" style="-webkit-text-stroke: 1px rgba(0,212,255,0.3); text-shadow: 0 0 20px rgba(0,212,255,0.4);">
                    ASTEROID
                    <br/>
                    DEFENDER
                </h1>
<div class="mt-6 flex justify-center gap-4 font-mono text-xs text-text-muted tracking-widest uppercase">
<span class="border border-surface-border bg-surface-dark px-2 py-1">V_2.4.1</span>
<span class="border border-surface-border bg-surface-dark px-2 py-1">SECTOR: 0-G</span>
<span class="border border-surface-border bg-surface-dark px-2 py-1 text-accent shadow-accent-glow">ENGINE: READY</span>
</div>
</div>
<!-- Menu Buttons -->
<div class="flex flex-col gap-4 w-full max-w-sm">
<button class="group relative flex items-center justify-center overflow-hidden border border-primary bg-primary/10 h-14 px-6 text-primary text-lg font-bold tracking-widest uppercase transition-all hover:bg-primary/20 hover:border-accent hover:text-accent hover:shadow-accent-glow focus:outline-none focus:ring-2 focus:ring-accent">
<div class="absolute left-0 top-0 h-full w-1 bg-primary group-hover:bg-accent transition-colors"></div>
<span class="relative z-10 flex items-center gap-3">
<span class="material-symbols-outlined text-xl">play_arrow</span>
                        START GAME
                    </span>
<div class="absolute right-0 top-0 h-full w-1 bg-primary group-hover:bg-accent transition-colors"></div>
</button>
<button class="group relative flex items-center justify-center overflow-hidden border border-surface-border bg-surface-dark/80 h-14 px-6 text-slate-300 text-lg font-bold tracking-widest uppercase transition-all hover:border-primary/50 hover:bg-surface-dark hover:text-white focus:outline-none focus:ring-1 focus:ring-primary">
<div class="absolute left-0 top-0 h-full w-1 bg-transparent group-hover:bg-primary/50 transition-colors"></div>
<span class="relative z-10 flex items-center gap-3">
<span class="material-symbols-outlined text-xl">leaderboard</span>
                        HIGH SCORES
                    </span>
</button>
<button class="group relative flex items-center justify-center overflow-hidden border border-surface-border bg-surface-dark/80 h-14 px-6 text-slate-300 text-lg font-bold tracking-widest uppercase transition-all hover:border-primary/50 hover:bg-surface-dark hover:text-white focus:outline-none focus:ring-1 focus:ring-primary">
<div class="absolute left-0 top-0 h-full w-1 bg-transparent group-hover:bg-primary/50 transition-colors"></div>
<span class="relative z-10 flex items-center gap-3">
<span class="material-symbols-outlined text-xl">tune</span>
                        SETTINGS
                    </span>
</button>
<button class="group relative flex items-center justify-center overflow-hidden border border-surface-border bg-surface-dark/80 h-14 px-6 text-slate-300 text-lg font-bold tracking-widest uppercase transition-all hover:border-red-500/50 hover:bg-surface-dark hover:text-red-400 focus:outline-none focus:ring-1 focus:ring-red-500 mt-4">
<span class="relative z-10 flex items-center gap-3">
<span class="material-symbols-outlined text-xl">power_settings_new</span>
                        EXIT
                    </span>
</button>
</div>
</div>
</main>
<!-- Bottom Status Bar -->
<footer class="border-t border-surface-border bg-surface-dark/80 backdrop-blur-sm px-6 py-2 z-10 flex justify-between items-center font-mono text-xs text-text-muted">
<div>CONNECTION: SECURE [UPLINK ACTIVE]</div>
<div class="flex gap-4">
<span>PING: 12ms</span>
<span>FR: 60FPS</span>
</div>
</footer>
</div>
</body></html>
