<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Asteroid Blaster Game Over</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f85149",
                        "secondary": "#58a6ff",
                        "background-light": "#f7f5f8",
                        "background-dark": "#0d1117",
                        "panel-border": "#30363d",
                        "panel-bg": "#161b22"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                    backgroundImage: {
                        'crt-scanlines': 'repeating-linear-gradient(transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px)',
                        'grid-pattern': 'linear-gradient(to right, rgba(88, 166, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(88, 166, 255, 0.05) 1px, transparent 1px)'
                    }
                },
            },
        }
    </script>
<style>
        .glitch-text {
            text-shadow: 2px 0 #f85149, -2px 0 #58a6ff;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen relative overflow-hidden">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(248,81,73,0.1)_0%,transparent_60%)] pointer-events-none"></div>
<div class="absolute inset-0 bg-grid-pattern bg-[size:40px_40px] pointer-events-none"></div>
<div class="absolute inset-0 bg-crt-scanlines pointer-events-none z-50 opacity-50"></div>
<div class="relative z-10 flex h-screen w-full flex-col justify-center items-center p-6">
<div class="layout-content-container flex flex-col max-w-[800px] w-full">
<h1 class="text-white glitch-text tracking-[0.2em] text-[64px] md:text-[80px] font-bold leading-tight px-4 text-center pb-8 pt-6 uppercase">
                Game Over
            </h1>
<div class="flex flex-col items-center bg-panel-bg border border-panel-border p-8 rounded relative shadow-[0_0_30px_rgba(88,166,255,0.05)] mb-12">
<div class="absolute -top-4 bg-background-dark px-4 flex gap-3">
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded border border-[#d2a8ff] bg-[#d2a8ff]/10 px-3">
<span class="material-symbols-outlined text-[#d2a8ff] text-[18px]">trophy</span>
<p class="text-[#d2a8ff] text-sm font-bold leading-normal tracking-wider">NEW HIGH SCORE</p>
</div>
</div>
<div class="flex flex-col items-center gap-2 text-center mt-4">
<p class="text-slate-400 text-lg md:text-xl font-medium leading-normal tracking-widest uppercase">Final Score</p>
<p class="text-secondary text-5xl md:text-7xl font-bold leading-tight drop-shadow-[0_0_15px_rgba(88,166,255,0.4)]">12,500</p>
</div>
<div class="w-full h-px bg-panel-border my-6 relative">
<div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 w-4 h-1 bg-secondary"></div>
</div>
<div class="grid grid-cols-2 gap-8 w-full px-4 text-center">
<div>
<p class="text-slate-500 text-sm uppercase tracking-wider mb-1">Enemies Destroyed</p>
<p class="text-slate-300 text-2xl font-bold">428</p>
</div>
<div>
<p class="text-slate-500 text-sm uppercase tracking-wider mb-1">Time Survived</p>
<p class="text-slate-300 text-2xl font-bold">14:32</p>
</div>
</div>
</div>
<div class="flex flex-col sm:flex-row justify-center gap-6 px-4">
<button class="group relative flex min-w-[200px] cursor-pointer items-center justify-center overflow-hidden rounded h-14 px-8 border border-primary bg-transparent text-primary hover:bg-primary hover:text-white transition-all duration-300 shadow-[0_0_15px_rgba(248,81,73,0.2)] hover:shadow-[0_0_25px_rgba(248,81,73,0.5)]">
<span class="material-symbols-outlined mr-2">replay</span>
<span class="text-lg font-bold tracking-[0.1em] uppercase">Play Again</span>
<div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-primary"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-primary"></div>
</button>
<button class="group relative flex min-w-[200px] cursor-pointer items-center justify-center overflow-hidden rounded h-14 px-8 border border-secondary bg-transparent text-secondary hover:bg-secondary hover:text-white transition-all duration-300 shadow-[0_0_15px_rgba(88,166,255,0.2)] hover:shadow-[0_0_25px_rgba(88,166,255,0.5)]">
<span class="material-symbols-outlined mr-2">menu</span>
<span class="text-lg font-bold tracking-[0.1em] uppercase">Main Menu</span>
<div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-secondary"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-secondary"></div>
</button>
</div>
</div>
</div>
</body></html>
