<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster - Game Over</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#ff4242",
          "secondary": "#00d4ff",
          "background-light": "#f8f5f5",
          "background-dark": "#1a1a1a",
          "panel-border": "#333333",
          "panel-bg": "rgba(255, 66, 66, 0.05)",
        },
        fontFamily: {
          "display": ["Space Grotesk", "sans-serif"],
          "mono": ["DM Sans", "monospace"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
        backgroundImage: {
          'crt-lines': 'linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06))',
          'grid-pattern': 'linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px)',
        },
        backgroundSize: {
          'crt': '100% 2px, 3px 100%',
          'grid': '40px 40px',
        }
      },
    },
  }
</script>
<style>
    .glitch-text {
        text-shadow: 2px 0 0 rgba(255, 66, 66, 0.8), -2px 0 0 rgba(0, 212, 255, 0.8);
    }
    .neon-text-red {
        text-shadow: 0 0 10px rgba(255, 66, 66, 0.5), 0 0 20px rgba(255, 66, 66, 0.3);
    }
    .neon-text-cyan {
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
    }
    .corner-brackets {
        position: relative;
    }
    .corner-brackets::before,
    .corner-brackets::after {
        content: '';
        position: absolute;
        width: 16px;
        height: 16px;
        border-color: #ff4242;
        border-style: solid;
        pointer-events: none;
    }
    .corner-brackets::before {
        top: -1px;
        left: -1px;
        border-width: 1px 0 0 1px;
    }
    .corner-brackets::after {
        bottom: -1px;
        right: -1px;
        border-width: 0 1px 1px 0;
    }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen relative overflow-x-hidden selection:bg-primary/30 selection:text-primary">
<!-- Background Effects -->
<div class="fixed inset-0 pointer-events-none z-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary/10 via-background-dark to-background-dark"></div>
<div class="fixed inset-0 pointer-events-none z-0 bg-grid-pattern bg-grid"></div>
<div class="fixed inset-0 pointer-events-none z-50 bg-crt-lines bg-crt opacity-20"></div>
<div class="relative z-10 flex min-h-screen w-full flex-col group/design-root">
<div class="layout-container flex h-full grow flex-col max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-panel-border/50 py-4 mt-4">
<div class="flex items-center gap-4 text-primary">
<span aria-hidden="true" class="material-symbols-outlined text-2xl">rocket_launch</span>
<h2 class="text-slate-100 text-xl font-bold tracking-widest uppercase">Astro Blaster <span class="text-primary text-sm ml-2 opacity-70">v.1.04</span></h2>
</div>
<div class="flex items-center gap-4 text-slate-400 font-mono text-xs uppercase tracking-widest">
<span>Sys.Status: <span class="text-primary font-bold">Critical</span></span>
<span class="hidden sm:inline-block">|</span>
<span class="hidden sm:inline-block">Signal: Lost</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center items-center py-12">
<!-- Title Section -->
<div class="text-center mb-16 relative">
<div class="absolute -inset-4 bg-primary/5 blur-2xl rounded-full"></div>
<h1 class="text-primary text-6xl md:text-8xl font-black leading-tight tracking-tighter uppercase glitch-text neon-text-red mb-2 relative z-10">
            Game Over
        </h1>
<p class="text-slate-400 font-mono text-sm uppercase tracking-[0.3em] relative z-10">Mission Failed / Hull Compromised</p>
</div>
<!-- Stats Panel -->
<div class="w-full max-w-2xl corner-brackets border border-panel-border bg-panel-bg backdrop-blur-sm p-8 sm:p-12 mb-12 relative overflow-hidden">
<!-- Scanline effect on panel -->
<div class="absolute inset-0 bg-[linear-gradient(transparent_50%,_rgba(0,0,0,0.1)_50%)] bg-[length:100%_4px] pointer-events-none opacity-50"></div>
<div class="relative z-10 flex flex-col items-center gap-6">
<h3 class="text-slate-400 font-mono text-sm tracking-widest uppercase">Mission Summary</h3>
<div class="flex flex-col items-center gap-2">
<p class="text-slate-300 text-lg uppercase tracking-wider">Final Score</p>
<div class="text-secondary text-5xl sm:text-7xl font-mono font-bold tracking-tight neon-text-cyan flex items-center gap-4">
<span class="text-slate-600 font-light select-none">~</span>
                    12,450
                    <span class="text-slate-600 font-light select-none">_</span>
</div>
</div>
<div class="mt-4 px-4 py-2 bg-yellow-500/10 border border-yellow-500/30 rounded flex items-center gap-2">
<span aria-hidden="true" class="material-symbols-outlined text-yellow-500 text-sm">trophy</span>
<span class="text-yellow-500 font-mono text-sm uppercase tracking-wider font-bold">New Personal Best</span>
</div>
<div class="w-full h-px bg-panel-border/50 my-4"></div>
<!-- Additional Stats Grid -->
<div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-4 text-center font-mono text-xs uppercase tracking-wider">
<div class="flex flex-col gap-1">
<span class="text-slate-500">Wave Reached</span>
<span class="text-slate-200 text-lg">42</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-slate-500">Enemies Dest.</span>
<span class="text-slate-200 text-lg">847</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-slate-500">Accuracy</span>
<span class="text-slate-200 text-lg">68%</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-slate-500">Play Time</span>
<span class="text-slate-200 text-lg">14:22</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-6 w-full max-w-xl justify-center">
<button class="group relative flex-1 min-h-[56px] px-8 bg-primary/10 hover:bg-primary/20 border border-primary text-primary font-mono uppercase tracking-widest text-sm font-bold transition-all duration-300 hover:shadow-[0_0_20px_rgba(255,66,66,0.4)] flex items-center justify-center gap-3 overflow-hidden">
<div class="absolute inset-0 bg-primary/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
<span aria-hidden="true" class="material-symbols-outlined relative z-10">refresh</span>
<span class="relative z-10">Reboot Mission</span>
</button>
<button class="group relative flex-1 min-h-[56px] px-8 bg-secondary/10 hover:bg-secondary/20 border border-secondary/50 hover:border-secondary text-secondary font-mono uppercase tracking-widest text-sm font-bold transition-all duration-300 hover:shadow-[0_0_20px_rgba(0,212,255,0.3)] flex items-center justify-center gap-3 overflow-hidden">
<div class="absolute inset-0 bg-secondary/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
<span aria-hidden="true" class="material-symbols-outlined relative z-10">home</span>
<span class="relative z-10">System Main Menu</span>
</button>
</div>
</main>
<!-- Footer -->
<footer class="py-6 border-t border-solid border-panel-border/50 flex justify-between items-center text-slate-500 font-mono text-xs uppercase tracking-widest">
<span>© 2024 Astro Blaster</span>
<span class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
        System Offline
    </span>
</footer>
</div>
</div>
</body></html>
