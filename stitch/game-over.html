<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#00d4ff",
          "background-light": "#f5f8f8",
          "background-dark": "#0f2023",
          "accent-red": "#ff4444",
          "accent-gold": "#ffd700",
        },
        fontFamily: {
          "display": ["Space Grotesk", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
        backgroundImage: {
          'crt-grid': 'linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px)',
        },
        backgroundSize: {
          'crt-grid-size': '20px 20px',
        }
      },
    },
  }
</script>
<style>
  body {
    background-color: #0d1117;
    background-image: radial-gradient(circle at center, rgba(255, 68, 68, 0.1) 0%, transparent 50%), 
                      linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), 
                      linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
  }
  
  .glitch-text {
    text-shadow: 2px 0 rgba(255, 68, 68, 0.8), -2px 0 rgba(0, 212, 255, 0.8);
  }
  
  .terminal-border {
    position: relative;
  }
  
  .terminal-border::before, .terminal-border::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1px solid theme('colors.primary');
    opacity: 0.5;
  }
  
  .terminal-border::before {
    top: -1px;
    left: -1px;
    border-right: none;
    border-bottom: none;
  }
  
  .terminal-border::after {
    bottom: -1px;
    right: -1px;
    border-left: none;
    border-top: none;
  }
</style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center overflow-hidden">
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-cover bg-center" data-alt="Deep space starfield with faint nebulas" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCRJnSnUv9v6ME7b2oQdoii4wHbEa1oC8XvVh7u7_QyQKpOhtI4xpvPUIEbupgI19jHcbCNmO65tITowJnLtV_iBbHcxDbGEe_kIgUJefvEPSAr7MWs_eO7oi5bFLuMJif7BSGSYhtSmu9-aUTBLaHHL4q-kvOxKTzFnF_FDx7lIZkxCok-6xl2lOdPRU7hMj3E6wHDxU_bFLZWzKQJYY_Zy0kvodCLf-nkYXPCnszzkE6EIeyyr-LlJBM1NICs7Nfd6zuWQ4xywMU');"></div>

</div>
<div class="w-full flex flex-col md:flex-row gap-6 mb-12">
<div class="flex-1 terminal-border border border-primary/30 bg-black/50 p-8 rounded-none backdrop-blur-md relative overflow-hidden group">

<p class="text-slate-400 text-sm font-medium tracking-[0.2em] uppercase mb-2">Final Score</p>
<p class="text-primary text-5xl md:text-6xl font-bold leading-tight drop-shadow-[0_0_10px_rgba(0,212,255,0.4)]">12,500</p>

<div class="flex h-8 items-center justify-center gap-x-2 rounded-none border border-accent-gold/50 bg-accent-gold/10 px-4">
