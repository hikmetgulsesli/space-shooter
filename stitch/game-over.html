<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Game Over Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff2e35",
                        "background-light": "#f8f5f5",
                        "background-dark": "#1a1a1a",
                        "cyan-accent": "#00d4ff",
                        "slate-gray": "#94a3b8",
                        "panel-border": "#334155"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .glitch-text {
            text-shadow: 2px 2px 0px rgba(255, 46, 53, 0.5), -2px -2px 0px rgba(0, 212, 255, 0.5);
        }
        .neon-glow-red {
            text-shadow: 0 0 10px rgba(255, 46, 53, 0.8), 0 0 20px rgba(255, 46, 53, 0.4);
        }
        .neon-glow-cyan {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .rivet {
            width: 4px;
            height: 4px;
            background-color: #475569;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5), 1px 1px 1px rgba(255,255,255,0.1);
        }
        .particle-bg {
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 46, 53, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen particle-bg relative">
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-2 h-2 bg-primary/20 rounded-full blur-sm"></div>
<div class="absolute top-3/4 left-1/3 w-3 h-1 bg-cyan-accent/20 rounded-full blur-sm rotate-45"></div>
<div class="absolute top-1/2 right-1/4 w-1 h-3 bg-primary/20 rounded-full blur-sm -rotate-45"></div>
<div class="absolute bottom-1/4 right-1/3 w-2 h-2 bg-cyan-accent/20 rounded-full blur-sm"></div>
</div>
<div class="relative z-10 flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col justify-center items-center py-12 px-4">
<div class="w-full max-w-4xl relative">
<!-- Outer Frame with Rivets -->
<div class="absolute inset-0 border border-panel-border pointer-events-none">
<div class="rivet top-2 left-2"></div>
<div class="rivet top-2 right-2"></div>
<div class="rivet bottom-2 left-2"></div>
<div class="rivet bottom-2 right-2"></div>
</div>
<div class="absolute inset-x-0 top-0 h-[1px] bg-cyan-accent/30 pointer-events-none"></div>
<div class="layout-content-container flex flex-col flex-1 bg-background-dark/80 backdrop-blur-sm border border-panel-border/50 p-8 shadow-2xl">
<header class="flex items-center justify-between whitespace-nowrap border-b border-panel-border pb-6 mb-8">
<div class="flex items-center gap-4 text-slate-100">
<span class="material-symbols-outlined text-cyan-accent">rocket_launch</span>
<h2 class="text-slate-100 text-xl font-bold leading-tight tracking-widest uppercase">ASTRO BLASTER</h2>
</div>
<div class="text-xs font-mono text-slate-gray flex gap-4">
<span>SYS.STAT: CRITICAL</span>
<span class="text-primary">HULL: 0%</span>
</div>
</header>
<div class="flex flex-col items-center justify-center py-12">
<h1 class="text-primary text-[64px] font-bold leading-none tracking-widest text-center mb-12 glitch-text neon-glow-red uppercase">GAME OVER</h1>
<div class="bg-black/40 border border-panel-border p-6 rounded-lg w-full max-w-md flex flex-col items-center gap-4 mb-12 relative overflow-hidden">
<div class="absolute inset-0 bg-cyan-accent/5 opacity-5 pointer-events-none bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+')]"></div>
<h2 class="text-cyan-accent text-[32px] font-mono font-bold leading-tight tracking-widest text-center neon-glow-cyan">
<span class="text-slate-gray text-sm block mb-1 tracking-normal font-sans">FINAL SCORE</span>
                                012500
                            </h2>
<div class="w-full h-px bg-panel-border/50 my-2"></div>
<p class="text-slate-gray text-lg font-mono font-bold leading-normal text-center flex items-center gap-2">
<span class="material-symbols-outlined text-sm">emoji_events</span>
                                BEST: 045900
                            </p>
</div>
<div class="flex justify-center w-full">
<div class="flex flex-1 gap-6 flex-wrap justify-center w-full max-w-2xl">
<button class="group relative flex min-w-[200px] cursor-pointer items-center justify-center overflow-hidden h-14 px-8 bg-transparent text-slate-100 text-lg font-bold leading-normal tracking-widest uppercase transition-all duration-300">
<div class="absolute inset-0 border-2 border-primary/50 group-hover:border-primary group-hover:bg-primary/10 transition-all duration-300"></div>
<div class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-primary"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-primary"></div>
<span class="relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-primary group-hover:neon-glow-red transition-all duration-300">replay</span>
                                        TRY AGAIN
                                    </span>
</button>
<button class="group relative flex min-w-[200px] cursor-pointer items-center justify-center overflow-hidden h-14 px-8 bg-transparent text-slate-100 text-lg font-bold leading-normal tracking-widest uppercase transition-all duration-300">
<div class="absolute inset-0 border-2 border-cyan-accent/50 group-hover:border-cyan-accent group-hover:bg-cyan-accent/10 transition-all duration-300"></div>
<div class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-cyan-accent"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-cyan-accent"></div>
<span class="relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-cyan-accent group-hover:neon-glow-cyan transition-all duration-300">menu</span>
                                        MAIN MENU
                                    </span>
</button>
</div>
</div>
</div>
<footer class="mt-auto border-t border-panel-border pt-4 text-center text-xs font-mono text-slate-gray flex justify-between px-4">
<span>MISSION FAILED</span>
<span>PRESS [SPACE] TO RESTART</span>
</footer>
</div>
</div>
</div>
</div>
</body></html>
