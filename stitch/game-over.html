<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Game Over Screen</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00d4ff",
              "background-light": "#f5f8f8",
              "background-dark": "#0f2023",
              "accent-red": "#ff4444",
              "accent-amber": "#f59e0b"
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        .grid-overlay {
            background-image: 
                linear-gradient(to right, rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5), 0 0 20px rgba(255, 68, 68, 0.3);
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
<div class="relative flex h-screen min-h-screen w-full flex-col overflow-hidden bg-gradient-to-c from-background-dark/90 via-background-dark to-background-dark">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,68,68,0.1)_0%,transparent_50%)]"></div>
<div class="absolute inset-0 grid-overlay"></div>
<div class="absolute inset-0 crt-overlay"></div>
<div class="layout-container relative z-10 flex h-full grow flex-col items-center justify-center px-4 sm:px-6 lg:px-8">
<div class="layout-content-container flex w-full max-w-[800px] flex-col items-center">
<h1 class="mb-12 text-center text-[4rem] sm:text-[5rem] font-bold leading-tight tracking-widest text-accent-red neon-glow">
                    GAME OVER
                </h1>
<div class="mb-12 flex w-full max-w-[400px] flex-col items-center justify-center gap-4 border border-primary/30 bg-primary/5 p-8 rounded backdrop-blur-sm">
<p class="text-sm font-medium tracking-[0.2em] text-primary/70">FINAL SCORE</p>
<p class="text-5xl font-bold tracking-widest text-slate-100">012500</p>
<div class="mt-4 flex items-center justify-center gap-2 rounded bg-primary/10 px-4 py-2 border border-primary/20">
<span class="material-symbols-outlined text-primary text-xl">emoji_events</span>
<p class="text-xs font-bold tracking-wider text-primary">NEW PERSONAL BEST</p>
</div>
</div>
<div class="flex w-full max-w-[500px] flex-col sm:flex-row justify-center gap-6 px-4">
<button class="group relative flex min-w-[200px] cursor-pointer items-center justify-center overflow-hidden rounded border border-primary bg-background-dark/50 h-14 px-8 text-primary transition-all hover:border-accent-amber hover:text-accent-amber hover:bg-accent-amber/10">
<span class="absolute left-0 top-0 h-[2px] w-0 bg-accent-amber transition-all group-hover:w-full"></span>
<span class="absolute bottom-0 right-0 h-[2px] w-0 bg-accent-amber transition-all group-hover:w-full"></span>
<span class="text-sm font-bold tracking-[0.2em]">TRY AGAIN</span>
</button>
<button class="group relative flex min-w-[200px] cursor-pointer items-center justify-center overflow-hidden rounded border border-primary/50 bg-background-dark/50 h-14 px-8 text-slate-300 transition-all hover:border-accent-amber hover:text-accent-amber hover:bg-accent-amber/10">
<span class="absolute left-0 top-0 h-[2px] w-0 bg-accent-amber transition-all group-hover:w-full"></span>
<span class="absolute bottom-0 right-0 h-[2px] w-0 bg-accent-amber transition-all group-hover:w-full"></span>
<span class="text-sm font-bold tracking-[0.2em]">MAIN MENU</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
