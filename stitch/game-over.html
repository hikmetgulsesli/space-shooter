<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Asteroid Defender Game Over Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#06d0f9",
          "background-light": "#f5f8f8",
          "background-dark": "#0d1117",
          "terminal-amber": "#ffb000",
          "terminal-red": "#ff3333"
        },
        fontFamily: {
          "display": ["Space Grotesk"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
        backgroundImage: {
            'scanlines': 'linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06))',
        }
      },
    },
  }
</script>
<style>
    .crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 2;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
    }
    .grid-bg {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(6, 208, 249, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(6, 208, 249, 0.05) 1px, transparent 1px);
    }
    .glitch-text {
        text-shadow: 2px 0 #ff3333, -2px 0 #06d0f9;
    }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen relative overflow-hidden crt grid-bg">
<!-- Starfield/Explosion Background Element -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-30 mix-blend-screen" data-alt="Faint explosion of glowing orange and cyan particle effects in space" style="background-image: radial-gradient(circle at center, rgba(255, 176, 0, 0.2) 0%, rgba(6, 208, 249, 0.1) 40%, transparent 70%);"></div>
<div class="relative z-10 flex h-full min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 sm:px-10 md:px-20 lg:px-40 flex flex-1 justify-center py-10">
<div class="layout-content-container flex flex-col w-full max-w-[800px] flex-1">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/30 px-6 py-4 mb-8 bg-black/40 backdrop-blur-sm rounded-t border border-primary/20">
<div class="flex items-center gap-4 text-primary">
<span class="material-symbols-outlined text-2xl">rocket_launch</span>
<h2 class="text-primary text-xl font-bold leading-tight tracking-[0.1em] uppercase">Asteroid Defender // System Report</h2>
</div>
<div class="text-primary/60 text-sm font-mono tracking-widest flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-terminal-red animate-pulse"></span>
                        SYS_FAIL_CODE: 404
                    </div>
</header>
<!-- Main Content Panel -->
<div class="flex-1 flex flex-col justify-center items-center">
<div class="w-full text-center mb-12">
<p class="text-terminal-red text-sm font-mono tracking-[0.2em] mb-2 uppercase glitch-text">Critical Hull Breach Detected</p>
<h1 class="text-transparent bg-clip-text bg-gradient-to-r from-terminal-red via-white to-primary tracking-[0.1em] text-[64px] md:text-[80px] font-bold leading-tight uppercase glitch-text drop-shadow-[0_0_15px_rgba(255,51,51,0.5)]">
                            GAME OVER
                        </h1>
</div>
<!-- Score Panel -->
<div class="w-full max-w-[600px] p-1 border border-primary/30 rounded bg-primary/5 shadow-[0_0_20px_rgba(6,208,249,0.1)] relative overflow-hidden mb-12 backdrop-blur-sm">
<!-- Corner brackets -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary"></div>
<div class="flex flex-col items-center justify-center py-10 px-6 gap-6 relative z-10">
<div class="flex flex-col items-center gap-2">
<span class="text-primary/70 text-sm font-mono tracking-widest uppercase">Mission Summary // Final Score</span>
<div class="text-primary tracking-widest text-[48px] md:text-[64px] font-bold leading-none drop-shadow-[0_0_10px_rgba(6,208,249,0.8)] font-mono">
                                    12,500
                                </div>
</div>
<div class="flex items-center gap-2 px-4 py-2 border border-terminal-amber/50 bg-terminal-amber/10 rounded">
<span class="material-symbols-outlined text-terminal-amber text-lg">military_tech</span>
<p class="text-terminal-amber text-sm font-bold tracking-widest uppercase drop-shadow-[0_0_5px_rgba(255,176,0,0.8)]">NEW HIGH SCORE</p>
</div>
<div class="w-full grid grid-cols-2 gap-4 mt-6 border-t border-primary/20 pt-6">
<div class="flex flex-col items-center">
<span class="text-primary/50 text-xs font-mono uppercase mb-1">Asteroids Destroyed</span>
<span class="text-slate-200 font-mono text-xl">4,208</span>
</div>
<div class="flex flex-col items-center">
<span class="text-primary/50 text-xs font-mono uppercase mb-1">Time Survived</span>
<span class="text-slate-200 font-mono text-xl">14:32</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex justify-center w-full">
<div class="flex flex-col sm:flex-row flex-1 gap-6 px-4 w-full max-w-[600px] justify-center">
<button class="group flex items-center justify-center overflow-hidden rounded h-14 px-8 bg-terminal-amber/10 hover:bg-terminal-amber/20 border-2 border-terminal-amber text-terminal-amber text-lg font-bold leading-normal tracking-[0.1em] grow uppercase transition-all duration-300 shadow-[0_0_15px_rgba(255,176,0,0.3)] hover:shadow-[0_0_25px_rgba(255,176,0,0.5)]">
<span class="material-symbols-outlined mr-2 group-hover:animate-spin">refresh</span>
<span class="truncate">TRY AGAIN</span>
</button>
<button class="flex items-center justify-center overflow-hidden rounded h-14 px-8 bg-transparent hover:bg-primary/10 border-2 border-primary text-primary hover:text-white text-lg font-bold leading-normal tracking-[0.1em] grow uppercase transition-all duration-300">
<span class="material-symbols-outlined mr-2">home</span>
<span class="truncate">MAIN MENU</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</body></html>
