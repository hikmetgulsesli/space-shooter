<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Gameplay HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00d4ff",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0f2023",
                        "hud-dark": "rgba(15, 32, 35, 0.85)",
                        "hud-border": "rgba(0, 212, 255, 0.3)",
                        "amber-glow": "#ffb000"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "ui": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        body {
            /* Simulating game background behind the HUD */
            background-image: radial-gradient(circle at center, #1a2a3a 0%, #050a0f 100%);
            background-size: cover;
            background-position: center;
        }
        .hud-panel {
            background-color: theme('colors.hud-dark');
            border: 1px solid theme('colors.hud-border');
            backdrop-filter: blur(4px);
        }
        .grid-bg {
            background-image: 
                linear-gradient(to right, rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="font-display text-slate-100 min-h-screen m-0 p-0 overflow-hidden relative grid-bg">
<!-- Top Navigation Bar (Score & Hi-Score) -->
<header class="absolute top-0 left-0 w-full hud-panel border-t-0 border-l-0 border-r-0 border-b flex items-center justify-between px-8 py-3 z-50">
<div class="flex items-center gap-4 text-primary">
<span aria-hidden="true" class="material-symbols-outlined !text-2xl">sports_esports</span>
<h1 class="text-2xl font-bold tracking-widest drop-shadow-[0_0_8px_rgba(0,212,255,0.8)]">SCORE: 000000</h1>
</div>
<div class="flex items-center">
<h2 class="text-slate-300 text-lg font-medium tracking-wider">HI-SCORE: 050000</h2>
</div>
</header>
<!-- Radar/Minimap (Top Right) -->
<div class="absolute top-20 right-8 z-40">
<div class="hud-panel w-48 h-48 rounded-full border border-primary/40 relative flex items-center justify-center shadow-[0_0_15px_rgba(0,212,255,0.15)]">
<!-- Radar Grids -->
<div class="absolute inset-2 border border-primary/20 rounded-full"></div>
<div class="absolute inset-8 border border-primary/20 rounded-full"></div>
<div class="absolute inset-14 border border-primary/20 rounded-full"></div>
<!-- Crosshairs -->
<div class="absolute w-full h-px bg-primary/30"></div>
<div class="absolute h-full w-px bg-primary/30"></div>
<!-- Player Marker -->
<div class="absolute w-2 h-2 bg-primary rounded-full shadow-[0_0_8px_rgba(0,212,255,1)]"></div>
<!-- Enemy Blips -->
<div class="absolute w-1.5 h-1.5 bg-red-500 rounded-full top-8 right-12 shadow-[0_0_5px_rgba(239,68,68,0.8)] animate-pulse"></div>
<div class="absolute w-1.5 h-1.5 bg-red-500 rounded-full bottom-14 left-10 shadow-[0_0_5px_rgba(239,68,68,0.8)] animate-pulse" style="animation-delay: 0.5s"></div>
<!-- Radar Sweep -->
<div class="absolute top-1/2 left-1/2 w-24 h-24 origin-top-left bg-gradient-to-br from-primary/20 to-transparent" style="transform: rotate(-45deg); clip-path: polygon(0 0, 100% 0, 100% 100%);"></div>
</div>
<div class="text-center mt-2 text-xs font-ui text-primary/70 tracking-widest">SCANNER ACTIVE</div>
</div>
<!-- Health Indicators (Bottom Left) -->
<div class="absolute bottom-8 left-8 z-40">
<div class="hud-panel p-4 rounded flex flex-col gap-2">
<p class="text-xs font-ui text-slate-400 tracking-widest mb-1">INTEGRITY</p>
<div class="flex gap-3">
<span class="material-symbols-outlined !text-3xl text-amber-glow drop-shadow-[0_0_8px_rgba(255,176,0,0.8)]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined !text-3xl text-amber-glow drop-shadow-[0_0_8px_rgba(255,176,0,0.8)]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined !text-3xl text-amber-glow drop-shadow-[0_0_8px_rgba(255,176,0,0.8)]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
</div>
<!-- Weapon Status (Bottom Right) -->
<div class="absolute bottom-8 right-8 z-40 w-72">
<div class="hud-panel p-5 rounded flex flex-col gap-4">
<div class="flex justify-between items-end border-b border-primary/20 pb-2">
<p class="text-xs font-ui text-slate-400 tracking-widest">WEAPON STATUS</p>
<p class="text-primary text-sm font-bold tracking-wider">AMMO: INFINITE</p>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between">
<p class="text-xs font-ui text-slate-300">COOLING GAUGE</p>
<p class="text-xs font-ui text-primary">75%</p>
</div>
<div class="h-2 rounded-full bg-background-dark border border-primary/30 overflow-hidden relative">
<!-- Cooling Bar Fill -->
<div class="h-full bg-gradient-to-r from-primary/50 to-primary rounded-full relative" style="width: 75%;">
<!-- Overheating marker -->
<div class="absolute top-0 right-0 bottom-0 w-4 bg-white/30 animate-pulse"></div>
</div>
</div>
</div>
<!-- Secondary Weapon Info -->
<div class="flex items-center gap-3 mt-1">
<div class="w-8 h-8 rounded bg-background-dark border border-primary/40 flex items-center justify-center">
<span class="material-symbols-outlined !text-sm text-primary">rocket_launch</span>
</div>
<div class="flex-1">
<p class="text-xs font-ui text-slate-400">SECONDARY</p>
<div class="flex gap-1 mt-1">
<div class="h-1.5 flex-1 bg-primary rounded-sm shadow-[0_0_5px_rgba(0,212,255,0.6)]"></div>
<div class="h-1.5 flex-1 bg-primary rounded-sm shadow-[0_0_5px_rgba(0,212,255,0.6)]"></div>
<div class="h-1.5 flex-1 bg-primary/20 rounded-sm"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Center Reticle (Decorative, non-interactive) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-none opacity-50">
<div class="relative w-32 h-32">
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary/60"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary/60"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary/60"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary/60"></div>
<!-- Center Dot -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-1 h-1 bg-primary rounded-full shadow-[0_0_4px_rgba(0,212,255,1)]"></div>
</div>
</div>
<!-- Threat Warnings (Bottom Center) -->
<div class="absolute bottom-12 left-1/2 transform -translate-x-1/2 z-40 text-center pointer-events-none">
<p class="text-red-500 font-ui text-sm tracking-[0.2em] font-bold drop-shadow-[0_0_5px_rgba(239,68,68,0.8)] opacity-70 animate-pulse">WARNING: HOSTILES APPROACHING</p>
</div>
</body></html>
