<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Gameplay HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00e1ff",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0f2123",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .crosshair-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen overflow-hidden selection:bg-primary/30">
<div class="relative w-full h-screen bg-slate-900/50 flex flex-col justify-between" style="background-image: radial-gradient(circle at center, transparent 0%, rgba(15, 33, 35, 0.8) 100%), linear-gradient(rgba(0, 225, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 225, 255, 0.05) 1px, transparent 1px); background-size: 100% 100%, 40px 40px, 40px 40px;">
<!-- Top HUD Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-primary/30 bg-background-dark/80 backdrop-blur-sm px-6 py-3 shadow-[0_4px_20px_rgba(0,225,255,0.1)]">
<div class="flex items-center gap-4">
<div class="text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">rocket_launch</span>
</div>
<h2 class="text-primary text-xl font-bold tracking-[0.1em] uppercase">ASTRO BLASTER</h2>
</div>
<div class="flex items-center gap-12">
<div class="flex items-center gap-8 border-r border-primary/30 pr-8">
<div class="flex flex-col items-start">
<span class="text-primary/70 text-xs font-medium tracking-widest uppercase">SCORE</span>
<span class="text-primary text-lg font-bold font-mono tracking-widest">00000</span>
</div>
<div class="flex flex-col items-start">
<span class="text-primary/70 text-xs font-medium tracking-widest uppercase">HIGH SCORE</span>
<span class="text-primary/80 text-lg font-bold font-mono tracking-widest">45000</span>
</div>
</div>
<div class="flex gap-2">
<div class="flex items-center justify-center h-10 w-10 border border-primary/50 bg-primary/10 rounded shadow-[0_0_10px_rgba(0,225,255,0.2)_inset]">
<span class="material-symbols-outlined text-primary text-xl shadow-primary">favorite</span>
</div>
<div class="flex items-center justify-center h-10 w-10 border border-primary/50 bg-primary/10 rounded shadow-[0_0_10px_rgba(0,225,255,0.2)_inset]">
<span class="material-symbols-outlined text-primary text-xl shadow-primary">favorite</span>
</div>
<div class="flex items-center justify-center h-10 w-10 border border-primary/50 bg-primary/10 rounded shadow-[0_0_10px_rgba(0,225,255,0.2)_inset]">
<span class="material-symbols-outlined text-primary text-xl shadow-primary">favorite</span>
</div>
</div>
</div>
</header>
<!-- Center Crosshair -->
<div class="crosshair-center pointer-events-none">
<span class="material-symbols-outlined text-primary/70 text-6xl drop-shadow-[0_0_8px_rgba(0,225,255,0.8)] font-light">my_location</span>
</div>
<!-- Bottom HUD Modules -->
<div class="flex justify-between items-end p-6 pointer-events-none">
<!-- Shield/Health Module -->
<div class="w-80 bg-background-dark/80 backdrop-blur-md border border-primary/40 rounded p-4 shadow-[0_0_15px_rgba(0,225,255,0.15)] pointer-events-auto">
<div class="flex justify-between items-end mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">shield</span>
<span class="text-primary text-sm font-bold tracking-widest uppercase">DEFLECTOR SHIELD</span>
</div>
<span class="text-primary font-mono text-sm">100%</span>
</div>
<div class="flex gap-1 h-4 mb-1">
<div class="h-full flex-1 bg-primary border border-primary/50 rounded-sm shadow-[0_0_8px_rgba(0,225,255,0.6)]"></div>
<div class="h-full flex-1 bg-primary border border-primary/50 rounded-sm shadow-[0_0_8px_rgba(0,225,255,0.6)]"></div>
<div class="h-full flex-1 bg-primary border border-primary/50 rounded-sm shadow-[0_0_8px_rgba(0,225,255,0.6)]"></div>
<div class="h-full flex-1 bg-primary border border-primary/50 rounded-sm shadow-[0_0_8px_rgba(0,225,255,0.6)]"></div>
<div class="h-full flex-1 bg-primary border border-primary/50 rounded-sm shadow-[0_0_8px_rgba(0,225,255,0.6)]"></div>
</div>
<div class="flex justify-between text-primary/50 text-[10px] uppercase tracking-widest font-mono">
<span>Critical</span>
<span>Stable</span>
</div>
</div>
<!-- Weapon Status Module -->
<div class="w-80 bg-background-dark/80 backdrop-blur-md border border-primary/40 rounded p-4 shadow-[0_0_15px_rgba(0,225,255,0.15)] pointer-events-auto flex flex-col">
<div class="flex justify-between items-start mb-3 border-b border-primary/20 pb-2">
<div class="flex flex-col gap-1">
<span class="text-primary/70 text-xs font-bold tracking-widest uppercase">SYS // WEAPON</span>
<span class="text-primary text-sm font-bold tracking-wider">PHOTON CANNON</span>
</div>
<div class="bg-primary/20 border border-primary text-primary text-[10px] font-bold px-2 py-1 rounded animate-pulse uppercase tracking-widest">
                        Ready
                    </div>
</div>
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-primary/60 text-[10px] uppercase tracking-widest mb-1">Charge Level</span>
<div class="flex items-center gap-2">
<div class="w-32 h-2 bg-background-dark border border-primary/30 rounded-full overflow-hidden">
<div class="h-full bg-primary shadow-[0_0_10px_rgba(0,225,255,0.8)]" style="width: 100%;"></div>
</div>
<span class="text-primary font-mono text-xs">100%</span>
</div>
</div>
<button class="bg-primary text-background-dark font-bold text-xs uppercase tracking-widest px-4 py-2 rounded shadow-[0_0_15px_rgba(0,225,255,0.4)] hover:bg-primary/90 transition-colors border border-transparent">
                        FIRE
                    </button>
</div>
</div>
</div>
</div>
</body></html>
