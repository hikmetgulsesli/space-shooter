<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#00d4ff",
                "accent": "#32cd32",
                "background-light": "#f5f8f8",
                "background-dark": "#0f2023",
              },
              fontFamily: {
                "display": ["Space Grotesk"]
              },
              borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            },
          },
        }
      </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-screen w-full flex-col overflow-hidden bg-black bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 to-black">
<!-- Background Elements (Stars/Grid) -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at center, #00d4ff 1px, transparent 1px); background-size: 50px 50px;"></div>
<div class="layout-container flex h-full grow flex-col pointer-events-none z-10">
<!-- Top HUD -->
<div class="flex justify-between items-start p-6">
<!-- Score & Player Info -->
<div class="flex flex-col gap-2">
<div class="flex items-center gap-3 border border-primary/50 px-4 py-2 rounded shadow-[0_0_10px_rgba(0,212,255,0.3)] bg-primary/5 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-xl">account_circle</span>
<h2 class="text-primary text-2xl font-bold tracking-widest drop-shadow-[0_0_5px_rgba(0,212,255,0.8)]">SCORE: 000000</h2>
</div>
</div>
<!-- Center Shield Bar -->
<div class="flex flex-col gap-2 min-w-[300px] border border-accent/50 px-6 py-3 rounded shadow-[0_0_10px_rgba(50,205,50,0.3)] bg-accent/5 backdrop-blur-sm relative">
<div class="absolute -top-1 -left-1 w-2 h-2 border-t border-l border-accent"></div>
<div class="absolute -top-1 -right-1 w-2 h-2 border-t border-r border-accent"></div>
<div class="absolute -bottom-1 -left-1 w-2 h-2 border-b border-l border-accent"></div>
<div class="absolute -bottom-1 -right-1 w-2 h-2 border-b border-r border-accent"></div>
<div class="flex justify-between items-center mb-1">
<p class="text-accent text-sm font-bold tracking-widest drop-shadow-[0_0_5px_rgba(50,205,50,0.8)]">SHIELD INTEGRITY</p>
<span class="material-symbols-outlined text-accent text-sm">security</span>
</div>
<div class="h-3 rounded-full bg-slate-900 border border-accent/30 p-[1px] flex gap-[2px]">
<div class="h-full bg-accent shadow-[0_0_8px_rgba(50,205,50,0.8)] flex-1 rounded-l-full"></div>
<div class="h-full bg-accent shadow-[0_0_8px_rgba(50,205,50,0.8)] flex-1"></div>
<div class="h-full bg-accent shadow-[0_0_8px_rgba(50,205,50,0.8)] flex-1"></div>
<div class="h-full bg-accent shadow-[0_0_8px_rgba(50,205,50,0.8)] flex-1"></div>
<div class="h-full bg-slate-800 flex-1 rounded-r-full"></div>
</div>
</div>
<!-- Lives -->
<div class="flex gap-3 border border-primary/50 px-4 py-2 rounded shadow-[0_0_10px_rgba(0,212,255,0.3)] bg-primary/5 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-2xl drop-shadow-[0_0_5px_rgba(0,212,255,0.8)]">rocket_launch</span>
<span class="material-symbols-outlined text-primary text-2xl drop-shadow-[0_0_5px_rgba(0,212,255,0.8)]">rocket_launch</span>
<span class="material-symbols-outlined text-primary/30 text-2xl">rocket_launch</span>
</div>
</div>
<!-- Central Target Reticle (Decorative) -->
<div class="flex-1 flex justify-center items-center">
<div class="relative w-48 h-48 flex justify-center items-center opacity-30">
<div class="absolute w-full h-[1px] bg-primary"></div>
<div class="absolute h-full w-[1px] bg-primary"></div>
<div class="absolute w-32 h-32 border border-primary rounded-full"></div>
<div class="absolute w-16 h-16 border border-primary rounded-full"></div>
<span class="material-symbols-outlined text-primary text-4xl">my_location</span>
</div>
</div>
<!-- Bottom HUD -->
<div class="flex justify-between items-end p-6">
<!-- Power-up Status -->
<div class="flex flex-col gap-2 border border-primary/50 p-4 rounded shadow-[0_0_10px_rgba(0,212,255,0.3)] bg-primary/5 backdrop-blur-sm relative">
<div class="absolute -top-1 -left-1 w-2 h-2 border-t border-l border-primary"></div>
<div class="absolute -bottom-1 -right-1 w-2 h-2 border-b border-r border-primary"></div>
<div class="flex items-center gap-3">
<p class="text-primary text-4xl font-bold tracking-widest drop-shadow-[0_0_5px_rgba(0,212,255,0.8)]">01</p>
<div class="flex flex-col">
<p class="text-primary/70 text-xs tracking-widest uppercase">Level</p>
<p class="text-primary text-sm font-bold tracking-widest flex items-center gap-1 drop-shadow-[0_0_5px_rgba(0,212,255,0.8)]">
<span class="material-symbols-outlined text-sm">bolt</span> POWER-UP
                            </p>
</div>
</div>
</div>
<!-- Radar -->
<div class="relative w-40 h-40 border border-primary/50 rounded-full shadow-[0_0_15px_rgba(0,212,255,0.2)] bg-primary/5 backdrop-blur-sm overflow-hidden">
<div class="absolute inset-0 rounded-full border border-primary/30 m-4"></div>
<div class="absolute inset-0 rounded-full border border-primary/30 m-8"></div>
<div class="absolute w-full h-[1px] bg-primary/30 top-1/2 -translate-y-1/2"></div>
<div class="absolute h-full w-[1px] bg-primary/30 left-1/2 -translate-x-1/2"></div>
<!-- Radar Sweep (Simulated with gradient) -->
<div class="absolute inset-0 bg-[conic-gradient(from_0deg,transparent_0deg,transparent_270deg,rgba(0,212,255,0.3)_360deg)] rounded-full"></div>
<!-- Radar blips -->
<div class="absolute w-2 h-2 bg-red-500 rounded-full top-8 left-12 shadow-[0_0_5px_rgba(239,68,68,1)]"></div>
<div class="absolute w-2 h-2 bg-red-500 rounded-full top-24 left-28 shadow-[0_0_5px_rgba(239,68,68,1)]"></div>
<div class="absolute w-1.5 h-1.5 bg-yellow-400 rounded-full top-16 left-20 shadow-[0_0_5px_rgba(250,204,21,1)]"></div>
<!-- Center Ship Blip -->
<div class="absolute w-2 h-2 bg-primary rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-[0_0_8px_rgba(0,212,255,1)]"></div>
</div>
</div>
</div>
</div>
</body></html>
