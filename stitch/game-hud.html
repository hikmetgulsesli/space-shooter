<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#06d0f9",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0f1f23",
                        "accent-orange": "#ff6b35",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        /* Base styles for the material symbols */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Utility class for the industrial panel brackets */
        .hud-bracket-tl { @apply absolute top-[-1px] left-[-1px] w-3 h-3 border-t-[2px] border-l-[2px] border-primary z-10; }
        .hud-bracket-tr { @apply absolute top-[-1px] right-[-1px] w-3 h-3 border-t-[2px] border-r-[2px] border-primary z-10; }
        .hud-bracket-bl { @apply absolute bottom-[-1px] left-[-1px] w-3 h-3 border-b-[2px] border-l-[2px] border-primary z-10; }
        .hud-bracket-br { @apply absolute bottom-[-1px] right-[-1px] w-3 h-3 border-b-[2px] border-r-[2px] border-primary z-10; }
        
        /* The main panel style */
        .hud-panel {
            @apply relative bg-[#1a1a1a]/80 backdrop-blur-md border border-primary/30 p-5 shadow-[0_0_15px_rgba(6,208,249,0.05)];
        }
    </style>
</head>
<body class="bg-[#050a0b] font-display text-slate-100 overflow-hidden w-screen h-screen relative select-none">
<!-- Gameplay Background Placeholder (Simulating space) -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#0f1f23] via-[#050a0b] to-black" data-alt="Deep space starfield gameplay background">
<!-- Abstract star pattern using CSS radial gradients for performance/scalability -->
<div class="absolute inset-0 opacity-40 mix-blend-screen" data-alt="Scattered distant stars in space" style="background-image: radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 120px, #06d0f9, rgba(0,0,0,0)); background-repeat: repeat; background-size: 200px 200px;"></div>
</div>
<!-- DevTool Grid & CRT Scanline Overlay -->
<div class="absolute inset-0 z-50 pointer-events-none opacity-[0.15] mix-blend-screen" data-alt="Geometric HUD grid and CRT monitor scanlines" style="background-image: linear-gradient(rgba(6, 208, 249, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 208, 249, 0.2) 1px, transparent 1px), linear-gradient(rgba(0,0,0,0.5) 50%, transparent 50%); background-size: 40px 40px, 40px 40px, 100% 4px;">
</div>
<!-- HUD Container -->
<div class="absolute inset-0 z-10 flex flex-col justify-between p-8 pointer-events-none">
<!-- Top HUD Row -->
<div class="flex justify-between items-start w-full">
<!-- Score Panel (Top Left) -->
<div class="hud-panel pointer-events-auto min-w-[240px]">
<div class="hud-bracket-tl"></div>
<div class="hud-bracket-tr"></div>
<div class="hud-bracket-bl"></div>
<div class="hud-bracket-br"></div>
<div class="flex flex-col gap-1">
<p class="text-primary/70 text-xs tracking-[0.2em] font-medium uppercase mb-1">Session Data</p>
<h1 class="text-primary text-[40px] font-bold leading-none tracking-tight drop-shadow-[0_0_12px_rgba(6,208,249,0.6)]">SCORE: <span class="text-white">09420</span></h1>
</div>
</div>
<!-- Lives Panel (Top Right) -->
<div class="hud-panel pointer-events-auto flex items-center gap-4 py-3">
<div class="hud-bracket-tl"></div>
<div class="hud-bracket-tr"></div>
<div class="hud-bracket-bl"></div>
<div class="hud-bracket-br"></div>
<p class="text-primary/70 text-xs tracking-[0.2em] font-medium uppercase mr-2">Integrity</p>
<div class="flex gap-2">
<span class="material-symbols-outlined text-primary text-3xl drop-shadow-[0_0_8px_rgba(6,208,249,0.8)]">rocket</span>
<span class="material-symbols-outlined text-primary text-3xl drop-shadow-[0_0_8px_rgba(6,208,249,0.8)]">rocket</span>
<span class="material-symbols-outlined text-primary/30 text-3xl">rocket</span>
</div>
</div>
</div>
<!-- Bottom HUD Row -->
<div class="flex justify-between items-end w-full">
<!-- Weapon Status Panel (Bottom Left) -->
<div class="hud-panel pointer-events-auto w-[360px]">
<div class="hud-bracket-tl"></div>
<div class="hud-bracket-tr"></div>
<div class="hud-bracket-bl"></div>
<div class="hud-bracket-br"></div>
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end border-b border-primary/20 pb-2">
<p class="text-primary text-sm tracking-[0.1em] font-medium">WEAPON STATUS: <span class="text-accent-orange drop-shadow-[0_0_5px_rgba(255,107,53,0.5)]">HEAT</span></p>
<p class="text-white text-sm font-mono tracking-wider">75%</p>
</div>
<!-- Segmented Bar -->
<div class="flex gap-[2px] h-3 w-full bg-background-dark/50 p-[2px] border border-primary/20 rounded-sm">
<div class="h-full flex-1 bg-accent-orange shadow-[0_0_8px_rgba(255,107,53,0.6)]"></div>
<div class="h-full flex-1 bg-accent-orange shadow-[0_0_8px_rgba(255,107,53,0.6)]"></div>
<div class="h-full flex-1 bg-accent-orange shadow-[0_0_8px_rgba(255,107,53,0.6)]"></div>
<div class="h-full flex-1 bg-accent-orange shadow-[0_0_8px_rgba(255,107,53,0.6)]"></div>
<div class="h-full flex-1 bg-accent-orange/20"></div>
<div class="h-full flex-1 bg-accent-orange/20"></div>
</div>
<div class="flex items-center gap-2 mt-1">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_6px_rgba(6,208,249,0.8)]"></div>
<p class="text-primary text-xs tracking-widest font-semibold uppercase">Sys Ready</p>
</div>
</div>
</div>
<!-- Radar / Minimap Panel (Bottom Right) -->
<div class="hud-panel pointer-events-auto p-2 rounded-full w-56 h-56 flex items-center justify-center relative bg-[#0f1f23]/90">
<!-- Circular Frame Brackets (Decorative) -->
<div class="absolute top-[-2px] left-1/2 -translate-x-1/2 w-8 h-[2px] bg-primary shadow-[0_0_8px_rgba(6,208,249,0.6)]"></div>
<div class="absolute bottom-[-2px] left-1/2 -translate-x-1/2 w-8 h-[2px] bg-primary shadow-[0_0_8px_rgba(6,208,249,0.6)]"></div>
<div class="absolute left-[-2px] top-1/2 -translate-y-1/2 h-8 w-[2px] bg-primary shadow-[0_0_8px_rgba(6,208,249,0.6)]"></div>
<div class="absolute right-[-2px] top-1/2 -translate-y-1/2 h-8 w-[2px] bg-primary shadow-[0_0_8px_rgba(6,208,249,0.6)]"></div>
<!-- Radar Display Area -->
<div class="w-full h-full rounded-full border border-primary/40 relative overflow-hidden flex items-center justify-center">
<!-- Concentric Rings -->
<div class="absolute w-[33%] h-[33%] rounded-full border border-primary/20"></div>
<div class="absolute w-[66%] h-[66%] rounded-full border border-primary/20"></div>
<!-- Crosshairs -->
<div class="absolute w-full h-[1px] bg-primary/20"></div>
<div class="absolute h-full w-[1px] bg-primary/20"></div>
<!-- Center Point (Player) -->
<div class="absolute w-1.5 h-1.5 rounded-full bg-white shadow-[0_0_5px_#fff] z-20"></div>
<!-- Static Radar Sweep (Conic Gradient) -->
<div class="absolute inset-0 rounded-full bg-[conic-gradient(from_0deg,transparent_0%,rgba(6,208,249,0.05)_20%,rgba(6,208,249,0.3)_25%,transparent_25.5%)] z-10" data-alt="Radar scanning sweep effect"></div>
<!-- Enemy Blips -->
<div class="absolute top-[25%] left-[60%] w-2 h-2 rounded-full bg-accent-orange shadow-[0_0_8px_rgba(255,107,53,0.9)] z-20"></div>
<div class="absolute top-[65%] left-[20%] w-2 h-2 rounded-full bg-accent-orange shadow-[0_0_8px_rgba(255,107,53,0.9)] z-20 opacity-60"></div>
<div class="absolute top-[70%] left-[75%] w-1.5 h-1.5 rounded-full bg-accent-orange shadow-[0_0_8px_rgba(255,107,53,0.9)] z-20 opacity-80"></div>
</div>
</div>
</div>
</div>
</body></html>
