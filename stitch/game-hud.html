    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#57a5ff",
          "background-light": "#f5f7f8",
          "background-dark": "#0f1823",

        fontFamily: {

<style>

    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.1) 50%,
      rgba(0,0,0,0.1)

    background-size: 100% 4px;
  }
</style>

<div class="absolute inset-0 pointer-events-none scanlines opacity-30 z-50"></div>
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_0%,theme('colors.background-dark')_100%)] opacity-80"></div>
<!-- Top Header HUD -->

<!-- Title / Logo -->
<div class="flex items-center gap-4 text-primary w-1/3">
<div class="size-6 text-primary drop-shadow-[0_0_8px_theme('colors.primary')]">

</div>

</div>
<!-- Scores -->
<div class="flex items-center justify-center gap-12 w-1/3">
<div class="flex flex-col items-center">
<span class="text-primary/70 text-xs font-bold tracking-[0.2em] mb-1">SCORE</span>
<span class="text-primary text-2xl font-bold tracking-widest drop-shadow-[0_0_10px_theme('colors.primary')]">12500</span>
</div>
<div class="h-8 w-px bg-primary/30"></div>
<div class="flex flex-col items-center">
<span class="text-primary/70 text-xs font-bold tracking-[0.2em] mb-1">HI-SCORE</span>
<span class="text-primary text-2xl font-bold tracking-widest drop-shadow-[0_0_10px_theme('colors.primary')]">45000</span>
</div>
</div>
<!-- Lives -->
<div class="flex items-center justify-end gap-3 w-1/3">
<span class="text-primary/70 text-xs font-bold tracking-[0.2em] mr-2">LIVES</span>
<div class="flex gap-2">
<div class="flex items-center justify-center w-10 h-10 rounded border border-primary/40 bg-primary/10 drop-shadow-[0_0_8px_theme('colors.primary')]">
<span class="material-symbols-outlined text-primary text-xl">rocket_launch</span>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded border border-primary/40 bg-primary/10 drop-shadow-[0_0_8px_theme('colors.primary')]">
<span class="material-symbols-outlined text-primary text-xl">rocket_launch</span>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded border border-primary/40 bg-primary/10 drop-shadow-[0_0_8px_theme('colors.primary')]">
<span class="material-symbols-outlined text-primary text-xl">rocket_launch</span>
</div>
</div>
</div>
</header>
<!-- Center Reticle / Canvas Area -->
<main class="relative z-30 flex-1 flex items-center justify-center pointer-events-none">
<div class="relative w-64 h-64 border border-primary/10 rounded-full flex items-center justify-center">
<div class="absolute top-0 bottom-0 left-1/2 w-px bg-primary/20"></div>
<div class="absolute left-0 right-0 top-1/2 h-px bg-primary/20"></div>
<div class="w-2 h-2 rounded-full bg-primary/60 drop-shadow-[0_0_5px_theme('colors.primary')]"></div>

<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary/40 rounded-tl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-primary/40 rounded-tr"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-primary/40 rounded-bl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary/40 rounded-br"></div>
</div>

<div class="pointer-events-auto border border-primary/40 bg-background-dark/80 backdrop-blur-md rounded-lg p-5 w-80 shadow-[0_0_20px_var(--tw-shadow-color)] shadow-primary/10">

<span class="material-symbols-outlined text-primary text-sm">shield</span>
<p class="text-primary text-sm font-bold tracking-[0.15em]">SHIELD INTEGRITY</p>
</div>
<p class="text-primary text-sm font-bold tracking-widest drop-shadow-[0_0_8px_theme('colors.primary')]">80%</p>
</div>
<div class="flex gap-1 h-4">
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary rounded-sm shadow-[0_0_8px_theme('colors.primary')]"></div>
<div class="flex-1 bg-primary/20 rounded-sm"></div>
<div class="flex-1 bg-primary/20 rounded-sm"></div>
</div>
<div class="mt-2 text-primary/50 text-[10px] tracking-[0.2em] text-right uppercase">
        System Nominal
      </div>
</div>
<!-- Weapon Status Module -->
<div class="pointer-events-auto border border-primary/40 bg-background-dark/80 backdrop-blur-md rounded-lg p-5 shadow-[0_0_20px_var(--tw-shadow-color)] shadow-primary/10 flex items-center gap-5">
<div class="flex flex-col gap-1 text-right">
<p class="text-primary/70 text-xs font-bold tracking-[0.2em]">WEAPON STATUS</p>
<p class="text-primary text-lg font-bold tracking-widest drop-shadow-[0_0_8px_theme('colors.primary')]">AUTO-BLASTER: <span class="text-white">READY</span></p>
</div>
<div class="h-10 w-px bg-primary/30"></div>
<button class="flex items-center justify-center w-14 h-14 bg-primary text-background-dark rounded border border-primary hover:bg-primary/90 transition-colors shadow-[0_0_15px_theme('colors.primary')] cursor-pointer">
<span class="material-symbols-outlined text-3xl">bolt</span>
