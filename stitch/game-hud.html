<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00d4ff",
              "background-light": "#f5f8f8",
              "background-dark": "#050a0b",
              "surface-dark": "#0a1416",
              "border-dark": "#10262b",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .grid-overlay {
            background-size: 40px 40px;
            background-image: 
              linear-gradient(to right, rgba(0, 212, 255, 0.05) 1px, transparent 1px),
              linear-gradient(to bottom, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            pointer-events: none;
        }
        .neon-text {
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.5), 0 0 10px rgba(0, 212, 255, 0.3);
        }
        .glow-box {
            box-shadow: inset 0 0 10px rgba(0, 212, 255, 0.1), 0 0 10px rgba(0, 212, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen relative overflow-hidden">
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=2000&amp;q=80')] bg-cover bg-center opacity-30" data-alt="Deep black space with starfield"></div>
</div>
<div class="absolute inset-0 grid-overlay z-0"></div>
<div class="absolute inset-0 crt-overlay z-50 mix-blend-overlay"></div>
<div class="relative z-10 flex flex-col h-screen w-full">
<header class="flex items-center justify-between border-b border-primary/30 bg-surface-dark/80 backdrop-blur-md px-6 py-3 border-x border-x-primary/30 mx-4 mt-4 rounded-t glow-box">
<div class="flex items-center gap-3 text-primary">
<span class="material-symbols-outlined text-2xl">rocket_launch</span>
<h2 class="text-primary text-xl font-bold tracking-widest neon-text">ASTRO BLASTER</h2>
</div>
<div class="flex flex-1 justify-end gap-10">
<div class="flex items-center gap-8 font-mono">
<div class="flex flex-col items-end">
<span class="text-primary/60 text-[10px] tracking-widest uppercase">SCORE</span>
<span class="text-primary font-bold text-lg neon-text leading-none">000000</span>
</div>
<div class="flex flex-col items-end">
<span class="text-primary/60 text-[10px] tracking-widest uppercase">HIGH</span>
<span class="text-primary/80 font-bold text-lg leading-none">145000</span>
</div>
</div>
<div class="flex gap-2 items-center border-l border-primary/20 pl-6">
<span class="material-symbols-outlined text-primary neon-text" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-primary neon-text" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-primary neon-text" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
</header>
<main class="flex-1 relative flex items-center justify-center border-x border-primary/30 mx-4 bg-surface-dark/40 overflow-hidden">
<div class="absolute bottom-20 left-1/2 transform -translate-x-1/2 flex flex-col items-center">
<div class="w-2 h-8 bg-primary/40 rounded-t blur-[2px] mb-1"></div>
<div class="w-12 h-16 relative">
<div class="absolute inset-x-0 bottom-0 h-10 bg-primary/20 rounded-t-full border-t-2 border-primary border-x border-x-primary/50"></div>
<div class="absolute inset-x-4 bottom-0 h-14 bg-primary/40 rounded-t-full border-t border-primary"></div>
<div class="absolute inset-x-5 bottom-0 h-16 bg-primary rounded-t-full shadow-[0_0_15px_rgba(0,212,255,0.8)]"></div>
<div class="absolute -bottom-2 inset-x-2 h-4 bg-orange-500 rounded-b-full blur-[3px] opacity-80"></div>
<div class="absolute -bottom-4 inset-x-4 h-6 bg-yellow-300 rounded-b-full blur-[4px] opacity-90"></div>
</div>
</div>
<div class="absolute top-1/4 left-1/3 w-8 h-8 rounded-full bg-red-500/20 border border-red-500/50 flex items-center justify-center animate-pulse">
<div class="w-4 h-4 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div>
</div>
<div class="absolute top-1/3 right-1/4 w-10 h-10 rounded-full bg-purple-500/20 border border-purple-500/50 flex items-center justify-center">
<div class="w-6 h-6 rounded-full bg-purple-500 shadow-[0_0_12px_rgba(168,85,247,0.8)]"></div>
</div>
<div class="absolute bottom-6 left-6 flex flex-col gap-2 w-12 h-48 justify-end bg-surface-dark/80 p-2 border border-primary/30 rounded backdrop-blur-sm glow-box">

<p class="text-primary text-xs font-mono font-medium tracking-widest">WPN ENG</p>
<p class="text-primary text-xs font-mono">100%</p>
</div>
<div class="w-full bg-primary/10 rounded h-full relative overflow-hidden flex flex-col justify-end">
<div class="w-full rounded bg-primary shadow-[0_0_10px_rgba(0,212,255,0.6)] relative z-10" style="height: 100%;">
<div class="absolute top-0 inset-x-0 h-1 bg-white/50"></div>
</div>
<div class="absolute inset-0 flex flex-col justify-between py-1 z-20 pointer-events-none">
<div class="w-full h-px bg-surface-dark/50"></div>
<div class="w-full h-px bg-surface-dark/50"></div>
<div class="w-full h-px bg-surface-dark/50"></div>
<div class="w-full h-px bg-surface-dark/50"></div>
</div>
</div>
</div>
<div class="absolute top-6 right-6 flex flex-col gap-2 bg-surface-dark/80 p-3 border border-primary/30 rounded backdrop-blur-sm glow-box min-w-[150px]">
<p class="text-primary/60 text-[10px] font-mono tracking-widest uppercase border-b border-primary/20 pb-1 mb-1">Target Lock</p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-red-500 text-sm">my_location</span>
<span class="text-red-400 text-xs font-mono">ENGAGED</span>
</div>
<div class="flex justify-between items-center mt-1">
<span class="text-primary/50 text-xs font-mono">DIST:</span>
<span class="text-primary text-xs font-mono">4.2k</span>
</div>
</div>
<div class="absolute top-6 left-6 bg-surface-dark/80 p-3 border border-primary/30 rounded backdrop-blur-sm glow-box">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full border-2 border-primary/50 flex items-center justify-center relative">
<div class="absolute inset-1 rounded-full border border-primary/30 border-t-primary animate-spin" style="animation-duration: 3s;"></div>
<span class="material-symbols-outlined text-primary text-lg">radar</span>
</div>
<div class="flex flex-col">
<span class="text-primary/60 text-[10px] font-mono tracking-widest uppercase">Sector</span>
<span class="text-primary text-sm font-mono font-bold">ALPHA-7</span>
</div>
</div>
</div>
</main>
<footer class="flex items-center justify-center border-t border-primary/30 bg-surface-dark/80 backdrop-blur-md px-6 py-2 border-x border-x-primary/30 mx-4 mb-4 rounded-b glow-box">
<div class="flex items-center gap-4">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse shadow-[0_0_5px_rgba(0,212,255,0.8)]"></span>
<p class="text-primary text-sm font-mono tracking-[0.2em] uppercase neon-text">WAVE 1</p>
<span class="w-2 h-2 rounded-full bg-primary animate-pulse shadow-[0_0_5px_rgba(0,212,255,0.8)]"></span>
</div>
</footer>
</div>
