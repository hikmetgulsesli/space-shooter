<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Active Gameplay Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 1,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .scanlines {
            position: relative;
        }
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        .glitch-text {
            text-shadow: 2px 0 #00d4ff, -2px 0 #ff00c8;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#00d4ff",
                "background-light": "#f5f8f8",
                "background-dark": "#1a1a1a",
                "panel-dark": "#232323",
                "accent-orange": "#ff6b35",
                "border-color": "#333333"
              },
              fontFamily: {
                "display": ["Space Grotesk", "sans-serif"],
                "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"]
              },
              borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            },
          },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen scanlines">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden p-6 box-border">
<!-- DevTool Border Overlay -->
<div class="absolute inset-0 border border-border-color pointer-events-none m-4 rounded z-10">
<!-- Grid lines -->
<div class="absolute top-0 bottom-0 left-1/4 border-r border-border-color/50 border-dashed"></div>
<div class="absolute top-0 bottom-0 right-1/4 border-r border-border-color/50 border-dashed"></div>
<div class="absolute left-0 right-0 top-1/4 border-b border-border-color/50 border-dashed"></div>
<div class="absolute left-0 right-0 bottom-1/4 border-b border-border-color/50 border-dashed"></div>
</div>
<div class="layout-container flex h-full grow flex-col relative z-20">
<div class="flex flex-1 justify-center py-2 h-full">
<div class="layout-content-container flex flex-col w-full max-w-[1200px] flex-1 border border-border-color bg-panel-dark/80 backdrop-blur-sm rounded-lg overflow-hidden shadow-[0_0_15px_rgba(0,212,255,0.1)]">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-border-color px-6 py-4 bg-background-dark/90">
<div class="flex items-center gap-4 w-1/3">
<div class="flex items-center gap-2 border border-primary/30 bg-primary/10 px-3 py-1.5 rounded">
<span class="text-primary font-mono text-xs uppercase tracking-wider">SCORE</span>
<span class="text-white font-mono text-lg font-bold">0001250</span>
</div>
</div>
<div class="flex items-center justify-center gap-3 w-1/3 text-primary">
<span class="material-symbols-outlined text-xl">rocket_launch</span>
<h2 class="text-primary text-2xl font-bold leading-tight tracking-[0.2em] glitch-text drop-shadow-[0_0_8px_rgba(0,212,255,0.8)]">ASTRO BLASTER</h2>
</div>
<div class="flex flex-1 justify-end gap-2 w-1/3">
<div class="flex gap-1 border border-border-color p-1 rounded bg-background-dark">
<span class="material-symbols-outlined text-primary text-xl">favorite</span>
<span class="material-symbols-outlined text-primary text-xl">favorite</span>
<span class="material-symbols-outlined text-primary text-xl">favorite</span>
</div>
</div>
</header>
<!-- Main Gameplay Area (Canvas placeholder) -->
<div class="flex w-full grow bg-background-dark relative p-4">
<div class="w-full h-[600px] border border-border-color rounded bg-[#111] relative overflow-hidden flex items-center justify-center" style="background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);">
<!-- Starfield decoration (pseudo-canvas) -->
<div class="absolute inset-0 opacity-50" style="background-image: radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 160px 120px, #fff, rgba(0,0,0,0)); background-repeat: repeat; background-size: 200px 200px;"></div>
<!-- Spaceship (placeholder) -->
<div class="absolute z-10 text-primary drop-shadow-[0_0_10px_rgba(0,212,255,0.8)]">
<svg fill="none" height="40" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="40">
<path d="M12 2L2 22l10-4 10 4L12 2z"></path>
<path d="M12 18v4"></path>
</svg>
</div>
<!-- Asteroids (placeholders) -->
<div class="absolute top-[20%] left-[30%] text-accent-orange opacity-80 rotate-45">
<svg fill="none" height="30" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="30">
<polygon points="12 2 20 8 22 18 14 22 4 16 2 8"></polygon>
</svg>
</div>
<div class="absolute top-[60%] right-[20%] text-accent-orange opacity-60 rotate-12">
<svg fill="none" height="45" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" width="45">
<polygon points="10 2 22 10 18 20 6 22 2 12"></polygon>
</svg>
</div>
<!-- Particle effects -->
<div class="absolute top-[40%] right-[40%] w-1 h-1 bg-primary rounded-full shadow-[0_0_5px_#00d4ff]"></div>
<div class="absolute top-[42%] right-[38%] w-1 h-1 bg-primary rounded-full shadow-[0_0_5px_#00d4ff]"></div>
<div class="absolute top-[38%] right-[41%] w-1.5 h-1.5 bg-primary rounded-full shadow-[0_0_8px_#00d4ff]"></div>
<div class="absolute top-4 right-4 text-[10px] font-mono text-border-color">CANVAS_RENDER_ACTIVE // FPS: 60</div>
</div>
</div>
<!-- Footer Controls Hint -->
<footer class="border-t border-border-color bg-panel-dark px-6 py-3 flex justify-between items-center">
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 font-mono text-xs text-slate-400">
<span class="bg-background-dark border border-border-color px-2 py-1 rounded text-primary">WASD</span>
<span>MOVE</span>
</div>
<div class="w-px h-4 bg-border-color"></div>
<div class="flex items-center gap-2 font-mono text-xs text-slate-400">
<span class="bg-background-dark border border-border-color px-4 py-1 rounded text-accent-orange">SPACE</span>
<span>FIRE</span>
</div>
</div>
<div class="font-mono text-[10px] text-border-color">
                            SYS.VER: 1.0.42_BETA
                        </div>
</footer>
</div>
</div>
</div>
</div>
</body></html>
