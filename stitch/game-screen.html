<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Gameplay Screen HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00d4ff",
                        "background-light": "#f5f8f8",
                        "background-dark": "#1a1a1a",
                        "panel-dark": "#0f2023",
                        "danger": "#ff3b30",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .industrial-border {
            border: 1px solid #00d4ff;
            position: relative;
        }
        .industrial-border::before, .industrial-border::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid #00d4ff;
        }
        .industrial-border::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        .industrial-border::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
        .hud-panel {
            background-color: rgba(15, 32, 35, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden min-h-screen">
<div class="relative w-full h-screen flex flex-col p-4 gap-4">
<!-- Game Canvas Area (Background) -->
<div class="absolute inset-0 z-0 bg-black overflow-hidden flex items-center justify-center">
<div class="w-full h-full bg-center bg-no-repeat bg-cover object-cover opacity-60" data-alt="Deep space nebula with stars" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBu3FcjmM2lO1DamdNmR5g53OyPxSa-PlTYIpUSznV3WtBDNvc77mAVquQ8_Fau15hx-TlE2qPoYPd59FNT0tu-3_rnWTE9FkGA7Jy47sb1stawaQdaTwI7USMVlGdzoFTdKgUb4vM3piMS5gRVBOrmfZ97xISnwXI4Kpwr-n_3BFCVoMomgQDe5NIvlH245BCqHdSau0Vlpygo3e1FwzSyNzqaOzU1IWCTEOezS-5D-LFUgAoJeQdPgxlX-UXH30wrNjpYlXsVvNY");'></div>
<!-- Mock player ship -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-primary">
<span class="material-symbols-outlined text-6xl">rocket</span>
</div>
<!-- Mock enemies -->
<div class="absolute top-1/4 left-3/4 text-danger">
<span class="material-symbols-outlined text-4xl">bug_report</span>
</div>
<div class="absolute top-1/3 left-1/4 text-danger">
<span class="material-symbols-outlined text-4xl">bug_report</span>
</div>
<!-- Mock projectiles -->
<div class="absolute top-[48%] left-[52%] w-2 h-8 bg-primary rounded-full transform rotate-45"></div>
<div class="absolute top-[45%] left-[55%] w-2 h-8 bg-primary rounded-full transform rotate-45"></div>
</div>
<!-- Top HUD -->
<header class="relative z-10 flex items-center justify-between w-full h-16">
<!-- Score Panel -->
<div class="industrial-border hud-panel px-6 py-2 flex items-center gap-4">
<span class="material-symbols-outlined text-primary">military_tech</span>
<div class="flex flex-col">
<span class="text-xs text-primary/70 uppercase tracking-widest">Score</span>
<span class="text-2xl font-bold text-primary font-mono tracking-wider leading-none">0001250</span>
</div>
</div>
<!-- Health Bar Panel -->
<div class="industrial-border hud-panel px-6 py-2 flex items-center gap-4">
<div class="flex flex-col items-end">
<span class="text-xs text-primary/70 uppercase tracking-widest mb-1">Hull Integrity</span>
<div class="flex gap-1">
<!-- 10 segmented blocks, 8 full, 2 empty -->
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger rounded-sm"></div>
<div class="w-4 h-6 bg-danger/20 rounded-sm"></div>
<div class="w-4 h-6 bg-danger/20 rounded-sm"></div>
</div>
</div>
<span class="material-symbols-outlined text-danger text-3xl ml-2">healing</span>
</div>
</header>
<!-- Main Empty Space for Game -->
<div class="flex-1 relative z-10 pointer-events-none">
<!-- Reticle -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 h-32 border border-primary/30 rounded-full flex items-center justify-center pointer-events-none">
<div class="w-2 h-2 bg-primary/80 rounded-full"></div>
<div class="absolute top-0 w-1 h-4 bg-primary/50"></div>
<div class="absolute bottom-0 w-1 h-4 bg-primary/50"></div>
<div class="absolute left-0 w-4 h-1 bg-primary/50"></div>
<div class="absolute right-0 w-4 h-1 bg-primary/50"></div>
</div>
</div>
<!-- Bottom HUD -->
<footer class="relative z-10 flex items-end justify-between w-full h-32">
<!-- Weapon & Level Panel -->
<div class="industrial-border hud-panel px-6 py-4 flex gap-8 items-center h-full">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded border border-primary bg-primary/10 size-16 shrink-0">
<span class="material-symbols-outlined text-primary text-3xl">electric_bolt</span>
</div>
<div class="flex flex-col justify-center">
<span class="text-xs text-primary/70 uppercase tracking-widest mb-1">Active Weapon</span>
<p class="text-primary text-xl font-bold leading-none tracking-wide">PULSE CANON</p>
<div class="flex gap-1 mt-2">
<div class="w-12 h-1 bg-primary"></div>
<div class="w-12 h-1 bg-primary"></div>
<div class="w-12 h-1 bg-primary/30"></div>
</div>
</div>
</div>
<div class="w-px h-12 bg-primary/30"></div>
<div class="flex flex-col justify-center">
<span class="text-xs text-primary/70 uppercase tracking-widest mb-1">Sector Level</span>
<p class="text-slate-100 text-3xl font-bold leading-none font-mono tracking-wider">04</p>
</div>
</div>
<!-- Mini Map -->
<div class="industrial-border hud-panel p-2 size-32 relative">
<div class="absolute inset-2 border border-primary/20 bg-panel-dark/80 overflow-hidden">
<!-- Radar grid -->
<div class="absolute inset-0 border border-primary/10 rounded-full scale-150"></div>
<div class="absolute inset-0 border border-primary/10 rounded-full scale-100"></div>
<div class="absolute inset-0 border border-primary/10 rounded-full scale-50"></div>
<div class="absolute top-1/2 left-0 right-0 h-px bg-primary/10"></div>
<div class="absolute left-1/2 top-0 bottom-0 w-px bg-primary/10"></div>
<!-- Entities -->
<!-- Player -->
<div class="absolute top-1/2 left-1/2 w-1.5 h-1.5 bg-white rounded-full transform -translate-x-1/2 -translate-y-1/2 shadow-[0_0_4px_#fff]"></div>
<!-- Enemies -->
<div class="absolute top-1/4 left-3/4 w-1.5 h-1.5 bg-danger rounded-full shadow-[0_0_4px_#ff3b30]"></div>
<div class="absolute top-1/3 left-1/4 w-1.5 h-1.5 bg-danger rounded-full shadow-[0_0_4px_#ff3b30]"></div>
<div class="absolute bottom-1/4 right-1/3 w-1.5 h-1.5 bg-danger rounded-full shadow-[0_0_4px_#ff3b30]"></div>
<!-- Scanning line effect -->
<div class="absolute top-1/2 left-1/2 w-1/2 h-px bg-primary/40 origin-left transform -rotate-45"></div>
</div>
<span class="absolute -top-6 right-0 text-[10px] text-primary/70 uppercase tracking-widest">Sensors</span>
</div>
</footer>
</div>
</body></html>
