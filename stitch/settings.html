<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Astro Blaster Technical Settings Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#00d4ff",
          "background-light": "#f5f6f8",
          "background-dark": "#1a1a1a",
          "industrial-border": "rgba(0, 212, 255, 0.3)",
          "terminal-bg": "rgba(26, 26, 26, 0.8)",
        },
        fontFamily: {
          "display": ["Space Grotesk", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
        backgroundImage: {
          'grid-pattern': "linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px)",
          'scanline': "linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1))"
        }
      },
    },
  }
</script>
<style>
  body {
    background-color: #1a1a1a;
  }
  .bg-grid {
    background-size: 40px 40px;
  }
  .bg-scanline {
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 50;
  }
  .neon-text {
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.7), 0 0 20px rgba(0, 212, 255, 0.5);
  }
  .neon-glow {
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  }
  .bracket-border {
    position: relative;
  }
  .bracket-border::before, .bracket-border::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2px solid var(--tw-colors-primary);
    pointer-events: none;
  }
  .bracket-border::before {
    top: -2px;
    left: -2px;
    border-right: none;
    border-bottom: none;
  }
  .bracket-border::after {
    bottom: -2px;
    right: -2px;
    border-left: none;
    border-top: none;
  }
  
  /* Checkbox custom SVG */
  .checkbox-tick {
    background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='%231a1a1a' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
  }
</style>
</head>
<body class="font-display bg-background-dark text-slate-100 min-h-screen relative overflow-hidden flex flex-col items-center justify-center">
<!-- Background layers -->
<div class="absolute inset-0 bg-grid-pattern bg-grid opacity-30"></div>
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(0,212,255,0.05)_0%,transparent_70%)]"></div>
<!-- Subtle drifting stars (static representation) -->
<div class="absolute w-1 h-1 bg-white rounded-full top-20 left-1/4 opacity-40"></div>
<div class="absolute w-2 h-2 bg-white rounded-full top-40 right-1/4 opacity-20"></div>
<div class="absolute w-1 h-1 bg-primary rounded-full bottom-32 left-1/3 opacity-60"></div>
<div class="absolute w-1.5 h-1.5 bg-white rounded-full bottom-20 right-1/3 opacity-30"></div>
<!-- CRT Scanline overlay -->
<div class="absolute inset-0 bg-scanline mix-blend-overlay"></div>
<div class="relative z-10 w-full max-w-2xl px-6 py-8 flex flex-col items-center gap-10">
<!-- Header -->
<div class="text-center space-y-2">
<h1 class="text-5xl font-black tracking-widest text-primary neon-text">SETTINGS</h1>
<p class="text-primary/60 text-sm tracking-[0.3em]">ASTRO BLASTER // TERMINAL v1.4</p>
</div>
<!-- Main Panel -->
<div class="w-full bg-terminal-bg border border-industrial-border p-8 bracket-border backdrop-blur-sm shadow-[0_0_30px_rgba(0,212,255,0.05)]">
<!-- Sliders -->
<div class="space-y-8 mb-10">
<!-- Music Volume -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<label class="text-slate-300 text-sm font-medium tracking-wider uppercase">Music Volume</label>
<span class="text-primary font-mono text-sm">80%</span>
</div>
<div class="relative h-2 bg-slate-800 rounded-none border border-industrial-border/30">
<div class="absolute top-0 left-0 h-full w-[80%] bg-primary/40"></div>
<div class="absolute top-1/2 -translate-y-1/2 left-[80%] w-3 h-5 bg-primary neon-glow cursor-pointer -ml-1.5 border border-white/20"></div>
</div>
</div>
<!-- SFX Volume -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<label class="text-slate-300 text-sm font-medium tracking-wider uppercase">SFX Volume</label>
<span class="text-primary font-mono text-sm">100%</span>
</div>
<div class="relative h-2 bg-slate-800 rounded-none border border-industrial-border/30">
<div class="absolute top-0 left-0 h-full w-full bg-primary/40"></div>
<div class="absolute top-1/2 -translate-y-1/2 right-0 w-3 h-5 bg-primary neon-glow cursor-pointer -ml-1.5 border border-white/20"></div>
</div>
</div>
</div>
<!-- Divider -->
<div class="h-px w-full bg-gradient-to-r from-transparent via-industrial-border to-transparent mb-10"></div>
<!-- Difficulty Toggle -->
<div class="mb-10">
<label class="block text-slate-300 text-sm font-medium tracking-wider uppercase mb-4 text-center">Difficulty Selection</label>
<div class="flex p-1 bg-slate-800/50 border border-industrial-border/30">
<label class="flex-1 text-center cursor-pointer">
<input class="peer sr-only" name="difficulty" type="radio" value="EASY"/>
<div class="py-2 text-sm tracking-wider font-medium text-slate-400 peer-checked:bg-primary/20 peer-checked:text-primary peer-checked:border-primary transition-all duration-200 border border-transparent">
              EASY
            </div>
</label>
<label class="flex-1 text-center cursor-pointer">
<input checked="" class="peer sr-only" name="difficulty" type="radio" value="NORMAL"/>
<div class="py-2 text-sm tracking-wider font-medium text-slate-400 peer-checked:bg-primary/20 peer-checked:text-primary peer-checked:border-primary peer-checked:neon-glow transition-all duration-200 border border-transparent">
              NORMAL
            </div>
</label>
<label class="flex-1 text-center cursor-pointer">
<input class="peer sr-only" name="difficulty" type="radio" value="HARD"/>
<div class="py-2 text-sm tracking-wider font-medium text-slate-400 peer-checked:bg-primary/20 peer-checked:text-primary peer-checked:border-primary transition-all duration-200 border border-transparent">
              HARD
            </div>
</label>
</div>
</div>
<!-- Toggles -->
<div class="space-y-4">
<label class="flex items-center gap-4 cursor-pointer group">
<div class="relative flex items-center justify-center w-6 h-6 border border-industrial-border bg-slate-800/50 group-hover:border-primary transition-colors">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="absolute inset-1 bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="text-slate-300 text-sm font-medium tracking-wider uppercase group-hover:text-primary transition-colors">Fullscreen Mode</span>
</label>
<label class="flex items-center gap-4 cursor-pointer group">
<div class="relative flex items-center justify-center w-6 h-6 border border-industrial-border bg-slate-800/50 group-hover:border-primary transition-colors">
<input class="peer sr-only" type="checkbox"/>
<div class="absolute inset-1 bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="text-slate-300 text-sm font-medium tracking-wider uppercase group-hover:text-primary transition-colors">Show FPS Counter</span>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex gap-6 mt-4">
<button class="flex-1 py-3 border border-industrial-border bg-transparent text-slate-400 hover:text-white hover:border-slate-400 hover:bg-white/5 transition-all text-sm tracking-widest uppercase font-bold">
        Cancel
      </button>
<button class="flex-1 py-3 border border-primary bg-primary/10 text-primary hover:bg-primary/20 hover:neon-glow transition-all text-sm tracking-widest uppercase font-bold relative overflow-hidden group">
<span class="relative z-10">Save Changes</span>
<div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
</button>
</div>
</div>
</body></html>
