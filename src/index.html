<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#09090b">
    <meta name="description" content="A retro-futuristic space shooter game with arcade-style gameplay">
    
    <title>Space Shooter</title>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Design System Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- UI Overlay System -->
        <div class="ui-overlay">
            <!-- HUD (Heads-Up Display) -->
            <div class="hud">
                <div class="hud-section">
                    <div class="hud-item">
                        <span class="hud-label">Score</span>
                        <span class="hud-value" id="score">0</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">Lives</span>
                        <span class="hud-value" id="lives">3</span>
                    </div>
                </div>
                
                <!-- Power-Up Indicators -->
                <div class="power-ups" id="powerUps">
                    <!-- Dynamic power-up indicators will be inserted here -->
                </div>
            </div>
            
            <!-- Main Menu Screen -->
            <div class="game-screen main-menu" id="mainMenu">
                <h1 class="game-title">Space Shooter</h1>
                <p class="game-subtitle">Defend the galaxy from the asteroid threat</p>
                <button class="btn btn-primary" id="startBtn">Start Game</button>
                <div style="margin-top: var(--space-8);">
                    <p style="color: var(--color-text-muted); font-size: var(--text-sm);">
                        High Score: <span id="highScore">0</span>
                    </p>
                </div>
            </div>
            
            <!-- Game Over Screen -->
            <div class="game-screen game-over" id="gameOver">
                <h2 class="game-over-title">Game Over</h2>
                <p class="game-over-score">Final Score: <span id="finalScore">0</span></p>
                <button class="btn btn-accent" id="restartBtn">Play Again</button>
            </div>
            
            <!-- Instructions -->
            <div class="instructions">
                <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> to Move · 
                <kbd>SPACE</kbd> to Shoot · 
                <kbd>R</kbd> to Restart
            </div>
        </div>
    </div>
    
    <script type="module" src="index.js"></script>
</body>
</html>
