<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            color: #0ff;
        }
        #gameCanvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        .screen.active {
            display: flex;
        }

        /* Main Menu Styles */
        #mainMenu {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }
        #mainMenu h1 {
            font-size: 64px;
            text-shadow: 0 0 30px #0ff;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }
        @media (max-width: 600px) {
            #mainMenu h1 {
                font-size: 36px;
                letter-spacing: 4px;
            }
        }
        #mainMenu .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }
        .high-score-display {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            padding: 20px 40px;
            margin-bottom: 40px;
            text-align: center;
        }
        .high-score-display .label {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }
        .high-score-display .value {
            font-size: 32px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }
        .menu-button {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            touch-action: manipulation;
        }
        .menu-button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }
        @media (max-width: 600px) {
            .menu-button {
                padding: 12px 30px;
                font-size: 16px;
                margin: 8px;
            }
        }

        /* Game UI Styles */
        #gameScreen {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            text-shadow: 0 0 10px #0ff;
            z-index: 10;
        }
        @media (max-width: 600px) {
            #ui {
                font-size: 14px;
                top: 10px;
                left: 10px;
            }
        }
        #ui div {
            margin-bottom: 8px;
        }
        .wave-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .wave-complete-text {
            font-size: 48px;
            color: #7ee787;
            text-shadow: 0 0 20px #7ee787;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .wave-complete-text {
                font-size: 32px;
            }
        }
        .wave-bonus {
            font-size: 24px;
            color: #ffa657;
            text-shadow: 0 0 10px #ffa657;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }
        @media (max-width: 600px) {
            #instructions {
                font-size: 11px;
                bottom: 10px;
            }
        }

        /* Pause Menu Styles */
        #pauseMenu {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 50;
        }
        #pauseMenu h1 {
            font-size: 48px;
            color: #ff0;
            text-shadow: 0 0 20px #ff0;
            margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            #pauseMenu h1 {
                font-size: 36px;
            }
        }
        .pause-button {
            background: transparent;
            border: 2px solid #ff0;
            color: #ff0;
            padding: 12px 30px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 8px;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .pause-button:hover {
            background: #ff0;
            color: #000;
        }

        /* Game Over Screen Styles */
        #gameOver {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 50;
        }
        #gameOver h1 {
            font-size: 64px;
            color: #f00;
            text-shadow: 0 0 30px #f00;
            margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            #gameOver h1 {
                font-size: 40px;
            }
        }
        .stats-container {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }
        .stat-box {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #f00;
            padding: 20px 30px;
            text-align: center;
            min-width: 150px;
        }
        @media (max-width: 600px) {
            .stat-box {
                min-width: 100px;
                padding: 15px 20px;
            }
        }
        .stat-box.highlight {
            background: rgba(0, 255, 255, 0.1);
            border-color: #0ff;
        }
        .stat-box .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .stat-box .value {
            font-size: 28px;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .stat-box .value {
                font-size: 20px;
            }
        }
        .stat-box.highlight .value {
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }
        .new-record {
            color: #ff0;
            font-size: 12px;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .game-over-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .restart-button {
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .restart-button:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }
        .menu-return-button {
            background: transparent;
            border: 2px solid #888;
            color: #888;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .menu-return-button:hover {
            background: #888;
            color: #000;
        }
        @media (max-width: 600px) {
            .restart-button, .menu-return-button {
                padding: 12px 25px;
                font-size: 14px;
            }
        }

        /* High Scores Screen */
        #highScoresScreen {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }
        #highScoresScreen h1 {
            font-size: 48px;
            text-shadow: 0 0 20px #0ff;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }
        @media (max-width: 600px) {
            #highScoresScreen h1 {
                font-size: 32px;
            }
        }
        .high-scores-table {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid #0ff;
            margin-bottom: 30px;
            min-width: 400px;
            max-width: 90%;
        }
        @media (max-width: 600px) {
            .high-scores-table {
                min-width: 300px;
            }
        }
        .high-scores-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .high-scores-table th {
            background: rgba(0, 255, 255, 0.1);
            padding: 12px 20px;
            text-align: left;
            font-size: 14px;
            color: #0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .high-scores-table th:last-child {
            text-align: right;
        }
        .high-scores-table td {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }
        .high-scores-table td:last-child {
            text-align: right;
        }
        .high-scores-table tr:hover {
            background: rgba(0, 255, 255, 0.05);
        }
        .hs-rank {
            color: #888;
        }
        .hs-rank.top3 {
            color: #ff0;
            font-weight: bold;
        }
        .hs-name {
            color: #fff;
        }
        .hs-score {
            color: #0ff;
        }
        .back-button {
            background: transparent;
            border: 2px solid #888;
            color: #888;
            padding: 12px 30px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .back-button:hover {
            background: #888;
            color: #000;
        }

        /* Wave complete message */
        .wave-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
        .wave-complete-text {
            font-size: 36px;
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
            margin-bottom: 10px;
        }
        .wave-bonus {
            font-size: 24px;
            color: #ff0;
        }

        /* Touch Control Styles */
        .touch-control {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .joystick-zone {
            transition: opacity 0.3s ease;
        }
        .joystick-knob {
            transition: transform 0.05s linear;
        }
        .fire-button {
            transition: background 0.1s ease, box-shadow 0.1s ease;
        }
        .fire-button:active {
            background: rgba(248, 81, 73, 0.5) !important;
            box-shadow: 0 0 20px rgba(248, 81, 73, 0.8) !important;
        }
    </style>
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="mainMenu" class="screen active">
        <h1>ASTRO BLASTER</h1>
        <div class="subtitle">HTML5 CANVAS SPACE SHOOTER</div>
        <div class="high-score-display">
            <div class="label">HIGH SCORE</div>
            <div class="value" id="highScoreDisplay">0</div>
        </div>
        <div>
            <button class="menu-button" id="startGameBtn">Start Game</button>
            <button class="menu-button" id="highScoresBtn">High Scores</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div>LIVES: <span id="lives">3</span></div>
            <div>WAVE: <span id="wave">1</span></div>
        </div>
        <div id="instructions">
            WASD: Move | SPACE: Shoot | ESC: Pause
        </div>
        <div class="wave-message" id="waveMessage">
            <div class="wave-complete-text" id="waveCompleteMessage">WAVE 1 COMPLETE!</div>
            <div class="wave-bonus" id="waveBonusMessage">+100 BONUS</div>
        </div>
    </div>

    <!-- Pause Menu -->
    <div id="pauseMenu" class="screen">
        <h1>PAUSED</h1>
        <button class="pause-button" id="resumeBtn">Resume</button>
        <button class="pause-button" id="restartFromPauseBtn">Restart</button>
        <button class="pause-button" id="quitToMenuBtn">Quit to Menu</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOver" class="screen">
        <h1>GAME OVER</h1>
        <div class="stats-container">
            <div class="stat-box">
                <div class="label">Session Score</div>
                <div class="value" id="finalScore">0</div>
            </div>
            <div class="stat-box">
                <div class="label">Wave Reached</div>
                <div class="value" id="finalWave">1</div>
            </div>
            <div class="stat-box highlight">
                <div class="label">High Score</div>
                <div class="value" id="highScoreFinal">0</div>
                <div class="new-record" id="newRecordIndicator" style="display: none;">NEW RECORD!</div>
            </div>
            <div class="stat-box">
                <div class="label">Games Played</div>
                <div class="value" id="totalGames">0</div>
            </div>
            <div class="stat-box">
                <div class="label">Total Score</div>
                <div class="value" id="totalScore">0</div>
            </div>
        </div>
        <div class="game-over-buttons">
            <button class="restart-button" id="restartBtn">Try Again</button>
            <button class="menu-return-button" id="mainMenuBtn">Main Menu</button>
        </div>
    </div>

    <!-- High Scores Screen -->
    <div id="highScoresScreen" class="screen">
        <h1>HIGH SCORES</h1>
        <div class="high-scores-table">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Pilot</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="highScoresTableBody">
                    <!-- Dynamic content -->
                </tbody>
            </table>
        </div>
        <button class="back-button" id="backFromHighScoresBtn">Back to Menu</button>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
